name: Deploy to CloudBase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装 CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: 准备部署目录
        run: |
          mkdir -p deploy
          cp index.html deploy/index.html

      - name: 部署到 CloudBase 静态托管
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          tcb login --cloudbase-api-key "${{ secrets.TCB_API_KEY }}" --env-id "$TCB_ENV_ID"
          tcb hosting deploy deploy/ /paper-workbench --env-id "$TCB_ENV_ID" --yes
