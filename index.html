/* ================= 统计函数（计量引擎） ================= */
function mean(a){if(!a.length)return NaN;return a.reduce((s,v)=>s+v,0)/a.length;}
function sd(a){const m=mean(a);if(a.length<2)return 0;return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/(a.length-1));}
function median(a){const s=[...a].sort((x,y)=>x-y);const n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;}
function quantile(a,q){const s=[...a].sort((x,y)=>x-y);const pos=(s.length-1)*q;const lo=Math.floor(pos),hi=Math.ceil(pos);return s[lo]+(s[hi]-s[lo])*(pos-lo);}
function totSS(y){const m=mean(y);return y.reduce((s,v)=>s+(v-m)*(v-m),0);}
function pearson(x,y){const n=x.length,mx=mean(x),my=mean(y);let sxy=0,sxx=0,syy=0;for(let i=0;i<n;i++){sxy+=(x[i]-mx)*(y[i]-my);sxx+=(x[i]-mx)**2;syy+=(y[i]-my)**2;}return sxy/Math.sqrt(sxx*syy||1);}
function normCdf(z){const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;}
function invert(m){const n=m.length;const aug=m.map((row,i)=>[...row.map(x=>x),...Array(n).fill(0).map((_,j)=>i===j?1:0)]);for(let col=0;col<n;col++){let piv=col;for(let r=col+1;r<n;r++)if(Math.abs(aug[r][col])>Math.abs(aug[piv][col]))piv=r;if(Math.abs(aug[piv][col])<1e-12)return null;[aug[col],aug[piv]]=[aug[piv],aug[col]];const d=aug[col][col];for(let j=0;j<2*n;j++)aug[col][j]/=d;for(let r=0;r<n;r++){if(r===col)continue;const f=aug[r][col];for(let j=0;j<2*n;j++)aug[r][j]-=f*aug[col][j];}}return aug.map(r=>r.slice(n));}
function olsFit(xs,y){const n=xs.length,k=xs[0].length;if(n<=k)return null;const XtX=Array.from({length:k},()=>Array(k).fill(0));const Xty=Array(k).fill(0);for(let i=0;i<n;i++){for(let a=0;a<k;a++){Xty[a]+=xs[i][a]*y[i];for(let b=0;b<k;b++)XtX[a][b]+=xs[i][a]*xs[i][b];}}const inv=invert(XtX);if(!inv)return null;const b=Array(k).fill(0);for(let a=0;a<k;a++)for(let j=0;j<k;j++)b[a]+=inv[a][j]*Xty[j];let sse=0;for(let i=0;i<n;i++){let p=0;for(let a=0;a<k;a++)p+=b[a]*xs[i][a];sse+=(y[i]-p)**2;}const sigma2=sse/(n-k);const se=b.map((_,a)=>Math.sqrt(sigma2*inv[a][a]));const t=b.map((v,i)=>v/se[i]);const p=t.map(tv=>2*(1-normCdf(Math.abs(tv))));const r2=1-sse/totSS(y);return{b,se,t,p,r2,n,k};}
function stars(p){return p<0.01?'***':p<0.05?'**':p<0.1?'*':'';}
function detectSep(line){if(line.includes('\t'))return'\t';const c=(line.match(/,/g)||[]).length;const s=(line.match(/\s+/g)||[]).length;return c>s?',':/\s+/;}
function parseData(text){const lines=String(text).split(/\r?\n/).filter(l=>l.trim()!=='');if(lines.length<2)return null;const sep=detectSep(lines[0]);const headers=lines[0].split(sep).map(h=>h.trim()).filter(Boolean);const rows=[];for(let i=1;i<lines.length;i++){const cells=lines[i].split(sep).map(c=>c.trim());if(cells.length<headers.length)continue;const row={};headers.forEach((h,idx)=>{const v=parseFloat(cells[idx]);row[h]=isNaN(v)?cells[idx]:v;});rows.push(row);}return{name:'数据集 '+(rows.length)+'×'+headers.length,headers,rows};}
function numericCols(ds){const cols=[];ds.headers.forEach(h=>{const vals=ds.rows.map(r=>r[h]).filter(v=>typeof v==='number');if(vals.length>=ds.rows.length*0.8&&vals.length>0)cols.push(h);});return cols;}
function colVals(ds,h){return ds.rows.map(r=>r[h]).filter(v=>typeof v==='number');}
function genEconMarkdown(ds){
  const cols=numericCols(ds);if(!cols.length)return'';
  let md='### 描述性统计\n\n| 变量 | N | 均值 | 标准差 | 最小 | p25 | 中位数 | p75 | 最大 |\n|---|---|---|---|---|---|---|---|---|\n';
  cols.forEach(h=>{const v=colVals(ds,h);md+=`| ${h} | ${v.length} | ${mean(v).toFixed(3)} | ${sd(v).toFixed(3)} | ${Math.min(...v).toFixed(3)} | ${quantile(v,.25).toFixed(3)} | ${median(v).toFixed(3)} | ${quantile(v,.75).toFixed(3)} | ${Math.max(...v).toFixed(3)} |\n`;});
  if(ds._ols){const r=ds._ols,names=['(常数)',...ds._xNames];md+='\n### 回归结果（OLS）\n\n| 变量 | 系数 | 标准误 | t 值 | p 值 |\n|---|---|---|---|---|\n';r.b.forEach((b,i)=>md+=`| ${names[i]} | ${b.toFixed(4)}${stars(r.p[i])} | ${r.se[i].toFixed(4)} | ${r.t[i].toFixed(3)} | ${r.p[i].toFixed(4)} |\n`);md+=`\nR² = ${r.r2.toFixed(3)}，N = ${r.n}\n`;}
  return md;
}

function svgLine(colsData){

  const n=colsData[0]?colsData[0].values.length:0;
  const px=i=>pad+(n>1?i*(W-pad*2)/(n-1):W/2);

  const colors=['#2563eb','#dc2626','var(--ok)'];
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:580px" role="img"><title>趋势折线图</title>`;

    s+=`<path d="${d}" fill="none" stroke="${colors[ci%3]}" stroke-width="2"/>`;

function svgPie(items){
  const total=items.reduce((s,i)=>s+Math.max(0,i.value),0)||1;
  const W=320,H=280,cx=170,cy=120,r=88;
  const colors=['#2563eb','#dc2626','var(--ok)','#d97706','#7c3aed','#0891b2','#db2777','#65a30d'];
  let ang=-Math.PI/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:340px" role="img"><title>构成占比</title>`;
  items.forEach((it,i)=>{
    const a2=ang+Math.max(0,it.value)/total*Math.PI*2;
    const large=(a2-ang)>Math.PI?1:0;
    const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang);

    s+=`<path d="M${cx} ${cy} L${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="${colors[i%colors.length]}"/>`;
    ang=a2;
  });
  items.forEach((it,i)=>{
    const pct=(Math.max(0,it.value)/total*100).toFixed(1);
    s+=`<rect x="22" y="${H-18-i*16}" width="10" height="10" rx="2" fill="${colors[i%colors.length]}"/>`;
    s+=`<text x="38" y="${H-9-i*16}" font-size="10" fill="#6b7280">${esc(String(it.label).slice(0,8))} ${pct}%</text>`;
  });

}
function svgHbar(items){
  const W=540,H=Math.max(120,items.length*34+34),padL=92,pad=38;

const CHART_NAMES={bar:'柱状图',heat:'热力图',scatter:'散点图',box:'箱线图',line:'折线图',pie:'饼图',hbar:'横向柱状图'};
function advisorAdvice(ds,goal){
  const cols=numericCols(ds),n=ds.rows.length;
  const catCols=ds.headers.filter(h=>!cols.includes(h));
  if(goal==='diff'){
    if(catCols.length)return{chart:'box',why:'有类别列「'+catCols[0]+'」（样本 '+n+'），用箱线图对比各组分布'+(n<10?'（n='+n+'<10，建议叠加散点显示每个样本点，审稿人最看重原始数据点）':'')+'。注意：样本量小严禁只画均值柱——柱状高度+一根误差棒会掩盖分布，审稿人大概率会要求 show individual data points。'};
    if(n<=15)return{chart:'box',why:'样本量仅 '+n+'，均值柱状图会掩盖分布，用箱线图，并叠加散点显示每个样本点（小样本画均值柱是科研制图经典错误）。'};
    return{chart:'bar',why:'样本量充足（'+n+'），用均值柱状图对比组间差异，并加误差线——图注必须写清误差类型（SD/SEM/95%CI）和样本量 n。'};
  }
  if(goal==='rel'){
    if(cols.length===2)return{chart:'scatter',why:'两个数值变量（'+cols[0]+' × '+cols[1]+'），散点图+拟合线看相关最直接。注意：①不要用双 Y 轴拼图制造虚假相关（视觉相关是作图者捏造的）；②X 是分类变量时严禁用折线连均值。'};
    return{chart:'heat',why:cols.length+' 个数值变量，热力图一览两两相关。注意：连续值颜色要加 colorbar；别用 rainbow/jet 色图（感知不均匀）。'};
  }
  if(goal==='trend')return{chart:'line',why:'趋势变化用折线图+误差带，横轴必须是时间/剂量等有序变量才有意义；分类数据不要用折线连均值（会暗示不存在的连续关系）。'};
  if(goal==='share')return{chart:'hbar',why:'构成占比用横向柱状图（按值排序）——饼图是人眼难判的经典错误（判角度差长度差 3 倍），审稿人普遍反感；占比差异小时堆叠柱更精确。'};
  return{chart:'box',why:'分布形状用箱线图/直方图：看中位数、四分位距（IQR）与离群值，比只看均值丰富得多；连续变量分布不要用饼图。'};
}

/* ================= 文件导入（txt/md/csv 直读 + docx 解压提取） ================= */
// 智能解码：UTF-8 严格解码失败（Excel 另存的 GBK/GB2312 CSV 常见）→ 自动回退 GBK
function decodeTextSmart(buf){
  try{return{text:new TextDecoder('utf-8',{fatal:true}).decode(buf),enc:'utf-8'};}
  catch(e){try{return{text:new TextDecoder('gbk').decode(buf),enc:'gbk'};}catch(e2){return{text:new TextDecoder('utf-8').decode(buf),enc:'utf-8'};}}
}
async function fileToText(file){
  const name=(file.name||'').toLowerCase();
  const ext=name.split('.').pop()||'';
  if(['txt','md','csv','tsv'].includes(ext))return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>{const d=decodeTextSmart(new Uint8Array(rd.result));res({text:d.text,imgs:0,tbls:0,enc:d.enc});};rd.onerror=()=>rej(new Error('读取文件失败'));rd.readAsArrayBuffer(file);});
  if(ext==='docx')return readDocx(file);
  throw new Error('暂不支持 .'+ext+' 格式：请先用 WPS 另存为 docx、txt 或 md 再导入（PDF 请另存为 docx/txt 后导入）');
}
function inflateRaw(data){
  return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(b=>new Uint8Array(b));
}
function findZipEntry(buf,targetName){
  let eocd=-1;
  for(let i=buf.length-22;i>=0;i--){
    if(buf[i]===0x50&&buf[i+1]===0x4b&&buf[i+2]===0x05&&buf[i+3]===0x06){eocd=i;break;}
  }
  if(eocd<0)return null;
  const cdOff=buf[eocd+16]|(buf[eocd+17]<<8)|(buf[eocd+18]<<16)|(buf[eocd+19]<<24);
  const cdSize=buf[eocd+12]|(buf[eocd+13]<<8)|(buf[eocd+14]<<16)|(buf[eocd+15]<<24);
  const cdEnd=cdOff+cdSize;
  let off=cdOff;
  while(off+46<=cdEnd){
    if(!(buf[off]===0x50&&buf[off+1]===0x4b&&buf[off+2]===0x01&&buf[off+3]===0x02))break;
    const method=buf[off+10]|(buf[off+11]<<8);
    const csize=buf[off+20]|(buf[off+21]<<8)|(buf[off+22]<<16)|(buf[off+23]<<24);
    const n=buf[off+28]|(buf[off+29]<<8);
    const x=buf[off+30]|(buf[off+31]<<8);
    const c=buf[off+32]|(buf[off+33]<<8);
    const lho=buf[off+42]|(buf[off+43]<<8)|(buf[off+44]<<16)|(buf[off+45]<<24);
    const name=new TextDecoder('utf-8').decode(buf.slice(off+46,off+46+n));
    if(name===targetName){
      const ln=buf[lho+26]|(buf[lho+27]<<8);
      const lx=buf[lho+28]|(buf[lho+29]<<8);
      return{method,dataStart:lho+30+ln+lx,dataEnd:lho+30+ln+lx+csize};
    }
    off+=46+n+x+c;
  }
  return null;
}
async function readDocx(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  const entry=findZipEntry(buf,'word/document.xml');
  if(!entry)throw new Error('docx 结构异常：未找到正文（document.xml）');
  let raw;
  if(entry.method===0){raw=buf.slice(entry.dataStart,entry.dataEnd);}
  else{raw=await inflateRaw(buf.slice(entry.dataStart,entry.dataEnd));}
  const xml=new TextDecoder('utf-8').decode(raw);
  const paras=xml.split(/<\/w:p>/).map(p=>{
    const texts=[];const re=/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g;let m;
    while(m=re.exec(p))texts.push(m[1].replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'"));
    return texts.join('');
  }).filter(t=>t.trim());
  if(!paras.length)throw new Error('docx 未提取到文本（可能内容为空）');
  let imgs=0,tbls=0;
  try{tbls=(xml.match(/<w:tbl>/g)||[]).length;}catch(e){}
  try{imgs=countZipPrefix(buf,'word/media/');}catch(e){}
  return{text:paras.join('\n'),imgs,tbls};
}
function countZipPrefix(buf,prefix){
  let eocd=-1;
  for(let i=buf.length-22;i>=0;i--){if(buf[i]===0x50&&buf[i+1]===0x4b&&buf[i+2]===0x05&&buf[i+3]===0x06){eocd=i;break;}}
  if(eocd<0)return 0;
  const cdOff=buf[eocd+16]|(buf[eocd+17]<<8)|(buf[eocd+18]<<16)|(buf[eocd+19]<<24);
  const cdSize=buf[eocd+12]|(buf[eocd+13]<<8)|(buf[eocd+14]<<16)|(buf[eocd+15]<<24);
  let off=cdOff,cnt=0;
  while(off+46<=cdOff+cdSize){
    if(!(buf[off]===0x50&&buf[off+1]===0x4b&&buf[off+2]===0x01&&buf[off+3]===0x02))break;
    const n=buf[off+28]|(buf[off+29]<<8);
    const x=buf[off+30]|(buf[off+31]<<8);
    const c=buf[off+32]|(buf[off+33]<<8);
    const name=new TextDecoder('utf-8').decode(buf.slice(off+46,off+46+n));
    if(name.startsWith(prefix))cnt++;
    off+=46+n+x+c;
  }
  return cnt;
}
function splitChapters(text){
  const lines=text.split(/\r?\n/);
  const chapters=[];let cur=null;
  lines.forEach(l=>{
    const t=l.trim();if(!t)return;
    const m1=t.match(/^(#{1,3})\s+(.*)/);
    const m2=t.match(/^第[一二三四五六七八九十百千]+[章节部分卷]\s*(.*)/);
    const m3=t.match(/^(摘要|引言|绪论|参考文献|结论|结语|致谢)\s*[：:．.、]?$/);
    const m4=t.match(/^[一二三四五六七八九十]+、\s*(.*)/);
    const m5=t.match(/^（[一二三四五六七八九十]+）\s*(.*)/);
    const m3b=t.match(/^(?:【|\[)?(摘\s*要|关键词)\s*[】\]：:]?\s*(.*)/);
    const m6=t.match(/^\d+(?:[、.]|\.[\d.]+)\s*[\u4e00-\u9fa5A-Za-z][\u4e00-\u9fa5A-Za-z0-9（）()·—\-：:]{1,17}$/);
    if(m1||m2||m3||m4||m5||m3b||m6){
      if(cur)chapters.push(cur);
      let name='章节',head='';
      if(m1)name=m1[2].trim();
      else if(m2)name=m2[0].trim();
      else if(m3)name=m3[1];
      else if(m4)name=m4[0].trim();
      else if(m5)name=m5[0].trim();
      else if(m3b){name=m3b[1].replace(/\s+/g,'');head=m3b[2].trim();}
      else if(m6)name=m6[0].trim();
      cur={name:name||'章节',content:head};
      return;
    }
    if(!cur){cur={name:'全文',content:''};}
    cur.content+=(cur.content?'\n':'')+t;
  });
  if(cur)chapters.push(cur);
  // 过滤空章（一级标题被二级标题顶空的产物），至少保留一章
  const nonEmpty=chapters.filter(c=>c.content&&countWords(c.content).total>0);
  return nonEmpty.length?nonEmpty:chapters;
}

/* ===== 2026-09-12 借鉴边界AI：风险句定位清单 / 前后并排对照 / 真实进度步骤条 ===== */
/* 风险值 → 等级与「具体动作」——不只给分，还告诉你要做什么（边界AI 唯一做对的地方） */
function _riskLevel(p){
  const n=parseFloat(p)||0;

  if(n>=50)return{cls:'mid',name:'中度',act:'建议酌情修改'};
  if(n>=30)return{cls:'low',name:'轻度',act:'可小幅调整'};

/* 风险句定位清单：① 句子原文 ② 风险值 ③ 具体动作 —— 先定位、再改写，替代"整篇重写" */
function _riskListHtml(items,o){

  const editable=!!o.editable;
  const rows=list.map((it,i)=>{
    const lv=_riskLevel(it.pct);

    return '<div class="riskl-row">'
      +(editable?('<input type="checkbox" data-orig="'+esc(txt)+'"'+(lv.cls==='hot'||lv.cls==='mid'?' checked':'')+' title="勾选后点下方按钮，只改这几句">'):'')
      +'<span class="riskl-n '+lv.cls+'">'+(i+1)+'</span>'
      +'<span class="riskl-sent">'+esc(txt)+'</span>'
      +'<span class="riskl-pct '+lv.cls+'">'+(esc(it.pct)||'—')+'%</span>'
      +'<span class="riskl-act '+lv.cls+'">'+lv.act+'</span>'
      +'</div>';
  }).join('');
  const nHot=list.filter(x=>(parseFloat(x.pct)||0)>=70).length;
  const nMid=list.filter(x=>{const n=parseFloat(x.pct)||0;return n>=50&&n<70;}).length;
  const nChk=list.filter(x=>(parseFloat(x.pct)||0)>=50).length;
  return '<div class="riskl"><div class="riskl-h">'
    +'<span>'+esc(o.title||'风险句定位')+'</span>'
    +'<span class="muted" style="font-weight:400;font-size:11.5px">共 '+list.length+' 句 · 重度 <b class="riskl-cnt">'+nHot+'</b> 句 · 中度 '+nMid+' 句</span>'
    +'<span style="flex:1"></span>'
    +(editable?('<button class="btn sm" id="riskl-all" type="button">全选</button><button class="btn sm" id="riskl-none" type="button">全不选</button>'):'')
    +'</div>'
    +'<div id="riskl-list">'+rows+'</div>'
    +(editable?('<div class="riskl-f">'
      +'<span style="font-size:12px">已勾选 <b id="riskl-n" style="color:var(--accent)">'+nChk+'</b> 句</span>'
      +'<button class="btn sm primary" id="riskl-go" type="button">仅改写勾选的句子</button>'
      +'<button class="btn sm" id="dr-restore-in" type="button" title="找回上一次的输入内容">↶ 恢复上次输入</button>'
      +'<span class="muted" style="font-size:11px">只把勾选的句子送去降重、其余保持原样——先定位再改写，比整篇重写更省 Key 也更准</span>'
      +'</div>'):'')
    +'</div>';
}
/* 前后逐句并排对照：左栏处理前、右栏处理后，逐句配对、有变化的一行加左侧色条 */
function _sbsHtml(orig,after,o){
  o=o||{};
  const SPLIT=/(?<=[。！？；!?;\n])/;
  const A=String(orig||'').split(SPLIT);
  const B=String(after||'').split(SPLIT);
  const A2=A.filter(x=>x.trim()!==''),B2=B.filter(x=>x.trim()!=='');
  if(!A2.length||!B2.length)return'';
  const n=Math.max(A2.length,B2.length);
  let chg=0,rows='';
  for(let i=0;i<n;i++){
    const a=A2[i]||'',b=B2[i]||'';
    const isChg=(a!==b);if(isChg)chg++;
    rows+='<div class="sbs-c b'+(isChg?' chg':'')+'">'+esc(a||'—')+'</div><div class="sbs-c a'+(isChg?' chg':'')+'">'+esc(b||'—')+'</div>';
  }
  return '<div style="font-size:12px;margin:14px 0 6px;font-weight:600">'+esc(o.title||'前后逐句并排对照')
    +'<span class="muted" style="font-weight:400;font-size:11px">（左=原文，右=处理后；逐句配对，左侧蓝条=这一句有变化，共 '+chg+' 句）</span></div>'
    +'<div class="sbs-wrap"><div class="sbs">'
    +'<div class="sbs-h b">原文（'+(o.leftName||'处理前')+'）</div><div class="sbs-h a">改后（'+(o.rightName||'处理后')+'）</div>'
    +rows
    +'</div></div>';
}
/* 真实进度步骤条：按实际完成的章节推进（不是定时器跳数），并支持外部注入耗时 */
function _awStepsHtml(ps,done,msg){
  const arr=ps||[];
  const n=arr.length||1;
  const steps=arr.map((s,i)=>{
    const cls=i<done?'done':(i===done?'active':'');
    const ic=i<done?'✓':String(i+1);
    const short=String((s&&s.h)||'').replace(/^第[一二三四五六七八九十]+章[·、\s]*/,'').replace(/[（(][^）)]*[)）]/g,'').slice(0,12);
    return '<div class="dr-step '+cls+'"><i>'+ic+'</i>'+esc(short)+'</div>';
  }).join('');
  const pct=Math.round(Math.min(done,n)/n*100);
  return '<div class="dr-steps">'+steps+'</div><div class="dr-bar"><span style="width:'+pct+'%"></span></div>'
    +'<div class="muted" id="aw-clock" style="font-size:11.5px;margin-top:2px" data-msg="'+esc(msg||'')+'">'+esc(msg||'')+'</div>';
}

  const needLLM=()=>{if(!LLM.get().enabled){show('<div class="card" style="background:var(--warn-soft);border-color:var(--warn-text);font-size:13px"><b>需要接入 LLM API</b><br><span class="muted" style="font-size:12px">该功能依赖大模型，请到「设置」页配置 API Key（默认推荐 DeepSeek，国内合规）。</span></div>');return false;}return true;};
  // ② 收敛精简：点「让 AI 收敛精简」时记录本次，触发同 kind 第二次调用并注入"上轮改太多"提醒（硬性）
  let drConv=null;
  // 结果缓存（sessionStorage）：切走模块再回来可一键找回上次结果，避免重复扣 API 费用
  const DR_CACHE_PREFIX='paperwb_dr_cache_';
  const saveCache=(kind,text,raw)=>{try{sessionStorage.setItem(DR_CACHE_PREFIX+kind,JSON.stringify({ts:Date.now(),text:text,raw:raw}));}catch(e){}};

  const run=async(kind,cachedR)=>{
  const FMT='\n\n【输出格式（必须遵守）】1.先输出「改动明细」：以"===== 改动明细 ====="开头，逐条列出本次处理的所有重要改动（最多50条），每条严格三行格式：\n[原文]：<处理前片段>\n[改后]：<处理后片段>\n[说明]：<修改理由/所用策略>\n【重要】[原文] 必须逐字复制输入文本中的原片段（含标点符号），不得有任何改动或改写，否则无法在原文中定位标注。\n2.再以"===== 全文结果 ====="开头，输出处理后的完整文本。\n3.除以上两部分外不要输出任何其它内容。';
  const ask=p=>llmAsk(p+FMT);
    const dtypeSel=document.getElementById('dr-dtype');

    const withDtype=p=>dtypeCtx+'\n'+p;

    // 长文自动分段：4 个改写工具（润色/逐句精修/降重/去AIGC）>5000 字按句边界自动分段全量处理——杜绝"静默截断后半文"。
    // 分段原则：按句子边界切（不截断句子），每段 ≤5000 字，逐段调用后拼接改动明细与改后全文。

      const segRun=async(mk,label)=>{

          show(warnHtml+'<div class="muted" style="padding:8px">'+label+'：全文 '+wcTotal+' 字，已自动分 '+segs.length+' 段逐段处理（长文分小段效果更稳、避免一次过长被截断），正在处理第 '+(si+1)+'/'+segs.length+' 段…</div>');

'\n8.【理由必须指认具体病灶】每条改动明细的[说明]必须写清具体语言病灶（如：语病类型、搭配不当、语义重复的具体字眼、口语词具体是哪个、前后不一致指什么）；禁止写"更流畅/更书面/更自然/更专业/表达更佳"等放之四海的万能理由。若某句你说不出具体病灶，只觉"这么改更好听"，说明这句本不该改——撤销这条改动。'+voiceHint+'\n\n待润色段落：\n"""'+seg+'"""');

      }else if(kind==='check'){

/* ==== 评比通知（内置 + 自定义）：紧凑行 + 查看通知 / 加入任务 / 删除 ==== */
const _cnClean=n=>String(n||'').replace(/^[（(]进行中[）)]\s*/,'');
function _findNotice(id){
  const c=Store.get(K.contestNotices,[]).find(x=>x.id===id);
  if(c)return Object.assign({},c,{__c:true});
  const b=CONTEST_LIB.find(x=>x.id===id);
  return b?Object.assign({},b,{__c:false}):null;
}
function _noticeAddToTasks(it,root){
  const l2=Store.get(K.contests,[]);
  const nm=_cnClean(it.name);
  if(l2.some(c=>c.name===nm))return toast('已在你的评比任务中');
  l2.push({id:uid(),name:nm,type:it.type||'research',deadline:it.deadline||'',wordReq:it.wordReq||'',stage:'选题',docId:'',
    note:it.__c?'':((it.hint?it.hint+'；':'')+(it.level||'')),materials:[],done:false,noticeText:it.notice||'',
    createdAt:Date.now(),updatedAt:Date.now()});
  Store.set(K.contests,l2);
  contestTab(root);
  toast('已加入「我的评比任务」');
}
function _noticeView(it,root){
  const src=it.src||'';
  const foot=(src||it.deadline)?'<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
    +(src?'<a class="btn sm" href="'+esc(src)+'" target="_blank" rel="noopener">'+LIBI.link+' 打开原始通知</a>':'')
    +(it.deadline?'<span class="muted" style="font-size:11px">'+LIBI.clock+' 到期：'+esc(it.deadline)+'</span>':'')+'</div>':'';
  modalBox({title:'评比通知 · '+_cnClean(it.name),wide:true,
    body:'<pre style="white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.75;max-height:58vh;overflow:auto;margin:0">'+esc(it.notice||'（暂无正文）')+'</pre>'+foot,
    buttons:[{label:'关闭'},{label:'加入我的任务',cls:'primary',onClick:()=>_noticeAddToTasks(it,root)}]});
}
function _noticeDel(it,root){
  const nm=_cnClean(it.name);
  if(it.__c){
    confirm2('确定删除「'+nm+'」？这是你添加的通知，删除后不可恢复。',()=>{
      Store.set(K.contestNotices,Store.get(K.contestNotices,[]).filter(x=>x.id!==it.id));
      contestTab(root);toast('已删除「'+nm.slice(0,16)+'」');
    });
    return;
  }
  confirm2('确定删除「'+nm+'」？只是本机隐藏，随时可在通知库右上「恢复全部」找回。',()=>{
    const h=Store.get(K.contestNoticeHidden,[]);
    if(!h.includes(it.id))h.push(it.id);
    Store.set(K.contestNoticeHidden,h);
    contestTab(root);toast('已隐藏「'+nm.slice(0,16)+'」');
  });
}
function noticeModal(root){
  modalBox({title:'添加通知',body:`<div style="display:flex;flex-direction:column;gap:10px">
    <div><label class="muted" style="display:block;margin-bottom:3px;font-size:12px">通知标题 <span style="color:var(--danger-text)">*</span></label><input id="nt-name" placeholder="例如：2027 年台州市优秀教育科研论文评比通知" style="width:100%"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><label class="muted" style="display:block;margin-bottom:3px;font-size:12px">类型（决定审稿标准）</label><select id="nt-type" style="width:100%">${Object.entries(CONTEST_TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      <div><label class="muted" style="display:block;margin-bottom:3px;font-size:12px">截止日期</label><input id="nt-dl" type="date" style="width:100%"></div>
    </div>
    <div><label class="muted" style="display:block;margin-bottom:3px;font-size:12px">简单要求（一行，显示在列表里）</label><input id="nt-req" placeholder="例如：台州市级 · 6000字 · 查重低于20%" style="width:100%"></div>
    <div><label class="muted" style="display:block;margin-bottom:3px;font-size:12px">通知正文（直接粘贴，或从文件导入）</label><textarea id="nt-body" placeholder="把通知全文粘贴在这里…" style="width:100%;min-height:150px;font-size:13px;line-height:1.7"></textarea></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><button type="button" id="nt-up" class="btn sm">${LIBI.doc} 从 Word / PDF / txt 导入</button><input type="file" id="nt-file" accept=".txt,.md,.docx,.doc,.pdf" style="display:none"><span class="muted" id="nt-state" style="font-size:11px">导入后自动填入正文、标题与截止日期</span></div>
  </div>`,buttons:[
    {label:'取消'},
    {label:'保存',cls:'primary',keep:true,onClick:()=>{
      const name=$('#nt-name').value.trim();
      if(!name)return toast('请填写通知标题');
      const arr=Store.get(K.contestNotices,[]);
      arr.push({id:uid(),name,type:$('#nt-type').value,deadline:$('#nt-dl').value,req:$('#nt-req').value.trim(),notice:$('#nt-body').value.trim(),ts:Date.now(),custom:true});
      Store.set(K.contestNotices,arr);
      closeModal();contestTab(root);toast('已添加「'+name.slice(0,18)+'」，显示在通知库最前');
    }}
  ]});
  setTimeout(()=>{
    const _n=$('#nt-name');if(_n)_n.focus();
    const up=$('#nt-up'),fi=$('#nt-file');
    if(up&&fi)up.onclick=()=>fi.click();
    if(!fi)return;
    fi.onchange=async e=>{
      const f=e.target.files[0];if(!f)return;
      const st=$('#nt-state');st.textContent='正在解析「'+f.name+'」…';
      try{
        let text='';
        if(/\.(txt|md)$/i.test(f.name))text=await f.text();
        else{
          const buf=await f.arrayBuffer();
          if(/\.docx?$/i.test(f.name))text=await _parseDocx(buf);
          else if(/\.pdf$/i.test(f.name))text=await _parsePdf(buf);
        }
        if(!text||text.length<10){st.textContent='⚠️ 未能提取到文本（PDF 可能是扫描件，可手动粘贴）';return;}
        $('#nt-body').value=text;
        if(!$('#nt-name').value){
          const l0=text.split('\n').map(x=>x.trim()).filter(Boolean)[0]||'';
          if(l0)$('#nt-name').value=l0.replace(/^(关于|关于开展|关于举办)/,'').replace(/(的)?通知$/,'').trim().slice(0,60);
        }
        if(!$('#nt-dl').value){
          const dm=text.match(/(?:截止|截至|于)?\s*(20\d{2})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
          if(dm)$('#nt-dl').value=dm[1]+'-'+String(+dm[2]).padStart(2,'0')+'-'+String(+dm[3]).padStart(2,'0');
        }
        if(!$('#nt-req').value){
          const w2=text.match(/(\d(?:\.\d)?)\s*万字/),w1=text.match(/(?:不(?:超过|多于|高于|少于))?\s*(\d{3,5})\s*字/);
          const w=w2?Math.round(parseFloat(w2[1])*10000):(w1?w1[1]:'');
          if(w)$('#nt-req').value=w+'字';
        }
        st.textContent='✅ 已导入并自动填入，请核对后保存';
      }catch(err){st.textContent='⚠️ 解析失败：'+(err.message||err);}
    };
  },60);
}
function buildLibHtml(){
  const custom=Store.get(K.contestNotices,[]).slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
  const hidden=Store.get(K.contestNoticeHidden,[]);
  /* 自定义通知置顶（按添加时间倒序）；内置通知按到期日近→远排，快到期/已逾期的一眼可见 */
  const list=[...custom.map(x=>Object.assign({},x,{__c:true})),...CONTEST_LIB.filter(x=>!hidden.includes(x.id)).sort((a,b)=>(a.deadline||'9999-99-99').localeCompare(b.deadline||'9999-99-99')).map(x=>Object.assign({},x,{__c:false}))];
  const today=todayStr();
  return `<div class="sec-head" style="margin:18px 0 8px">
    <span class="sec-head-l"><span class="sec-head-t">内置评比通知库</span><span class="muted" style="font-size:12px">已内置 ${CONTEST_LIB.length} 项${custom.length?' · 我的 '+custom.length+' 条':''}${hidden.length?' · 已隐藏 '+hidden.length+' 项':''}</span></span>
    <span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${hidden.length?'<button class="btn sm" id="lib-restore">恢复全部</button>':''}<button class="btn primary sm" id="lib-add-new">${LIBI.plus} 添加通知</button></span>
  </div>
  ${list.length?list.map((it,i)=>{
    const due=it.deadline||'';
    const hot=due&&due<today, near=due&&!hot&&due<=addDays(today,7);
    const parts=[it.__c?(it.req||''):(it.level||''),it.wordReq?esc(it.wordReq)+' 字':'',due?'到期 <span class="due'+(hot?' hot':near?' near':'')+'">'+esc(due)+'</span>':''].filter(Boolean);
    return `<div class="crow" data-lib="${it.id}" title="点这一行查看通知">
      <span class="crow-n${hot?' hot':near?' near':''}">${i+1}</span>
      <span class="crow-ico">${LIBI.doc}</span>
      <span class="crow-t">${esc(_cnClean(it.name))}</span>
      ${parts.length?'<span class="crow-sep">·</span><span class="crow-m">'+parts.join(' · ')+'</span>':''}
      <span class="crow-sp"></span>
      <span class="crow-acts">
        <button class="btn sm lib-view" data-id="${it.id}">查看通知</button>
        <button class="btn sm primary lib-add" data-id="${it.id}">加入任务</button>
        <button class="btn sm danger lib-del" data-id="${it.id}">删除</button>
      </span>
    </div>`;}).join(''):'<div class="empty">通知库已清空，点右上「恢复全部」找回内置通知</div>'}`;
}
function contestTab(root){

      <span class="crow-n${c.done?' ok':overdue?' hot':near?' near':''}">${i+1}</span>

  // 整行点击 = 打开编辑窗（视觉只留「删除」，功能一个不少）

    const list=Store.get(K.contests,[]);
    const data={name:$('#cs-name').value||'未命名评比',type:$('#cs-type').value,deadline:$('#cs-dl').value,wordReq:$('#cs-wr').value.trim(),stage:$('#cs-stage').value,docId:$('#cs-doc').value,materials:$$('.cs-mat').filter(x=>x.checked).map(x=>x.value),note:$('#cs-note').value.trim(),done:!!(cs&&cs.done),noticeText:(window._csText||'')};
    if(cs){const t=list.find(x=>x.id===cs.id);if(t){Object.assign(t,data);t.updatedAt=Date.now();}else{list.push({id:cs.id,...data,createdAt:cs.createdAt||Date.now(),updatedAt:Date.now()});}}

  // —— 上传评比通知 → 解析 → 自动提取填入 ——
  const _parseAnyFile=async f=>{
    if(/\.(txt|md)$/i.test(f.name))return await f.text();
    const buf=await f.arrayBuffer();
    if(/\.docx?$/i.test(f.name))return await _parseDocx(buf);
    if(/\.pdf$/i.test(f.name))return await _parsePdf(buf);
    return '';
  };
  const _extractRules=text=>{
    const out={};
    const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines[0])out.name=lines[0].replace(/^(关于|关于开展|关于举办)/,'').replace(/(的)?通知$/,'').trim().slice(0,60)||lines[0];
    out.type=/教学案例|优秀案例|案例评比/.test(text)?'case':/毕业论文|学位论文/.test(text)?'graduation':'research';
    const dm=text.match(/(?:截止|截至|于)?\s*(20\d{2})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
    if(dm)out.deadline=dm[1]+'-'+String(+dm[2]).padStart(2,'0')+'-'+String(+dm[3]).padStart(2,'0');
    const wm2=text.match(/(\d(?:\.\d)?)\s*万字/);
    const wm=text.match(/(?:不(?:超过|多于|高于|少于))?\s*(\d{3,5})\s*字/);
    if(wm2)out.wordReq=String(Math.round(parseFloat(wm2[1])*10000));
    else if(wm)out.wordReq=wm[1];
    const mt=text.match(/[^。\n]{0,20}(?:一式|盲审|匿名|电子稿|材料)[^。\n]{0,30}/g);
    if(mt)out.note=mt.slice(0,3).join('；').slice(0,120);
    return out;
  };
  $('#cs-upbtn').onclick=()=>$('#cs-file').click();
  $('#cs-file').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    $('#cs-upstate').textContent='正在解析「'+f.name+'」…';
    try{
      const text=await _parseAnyFile(f);
      if(!text||text.length<10){$('#cs-upstate').textContent='⚠️ 未能提取到文本（PDF 可能是扫描件，可手动填写）';return;}
      const ex=_extractRules(text);
      if(ex.name)$('#cs-name').value=ex.name;
      if(ex.type&&!cs)$('#cs-type').value=ex.type;
      if(ex.deadline)$('#cs-dl').value=ex.deadline;
      if(ex.wordReq)$('#cs-wr').value=ex.wordReq;
      if(ex.note){const n=$('#cs-note');if(!n.value)n.value=ex.note;}
      $('#cs-upstate').textContent='✅ 已自动提取填入，请核对后保存'+(ex.type==='case'?'（识别为教学案例）':ex.type==='graduation'?'（识别为毕业论文）':'（识别为教学论文）');
      window._csText=text;
    }catch(err){$('#cs-upstate').textContent='⚠️ 解析失败：'+err.message;}
  };
  // AI 智能提取（需 LLM Key，比本地规则更准）
  $('#cs-ai-extract').onclick=async()=>{
    const text=window._csText;
    if(!text)return toast('请先上传评比通知文档');
    const cfg=LLM.get();
    if(!cfg.enabled)return toast('未配 LLM Key：可先用「上传」按钮的本地规则提取');
    $('#cs-upstate').innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;vertical-align:-2px"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 4v4M8 13h.01M16 13h.01M9 17h6"/></svg> AI 正在提取…';
    try{
      const r=await llmAsk('你是教育行政评比通知解析助手。从下面通知中提取：评比名称（完整标题）、论文类型（只能是 教学论文/教学案例/毕业论文 之一）、截止日期（YYYY-MM-DD）、字数要求（纯数字）、备注（材料/盲审等要求 50 字内）。只输出 JSON：{"name":"","type":"","deadline":"","wordReq":"","note":""}。\n\n通知全文：\n'+text.slice(0,3000));
      const j=JSON.parse((r||'').replace(/```json|```/g,'').trim());
      if(!j||typeof j!=='object')throw new Error('返回格式错误');
      if(j.name)$('#cs-name').value=j.name;
      if(j.type&&!cs){const map={教学论文:'research',教学案例:'case',毕业论文:'graduation',案例:'case'};const v=map[j.type]||j.type;if(['research','case','graduation','journal'].includes(v))$('#cs-type').value=v;}
      if(j.deadline)$('#cs-dl').value=j.deadline;
      if(j.wordReq)$('#cs-wr').value=String(j.wordReq).replace(/[^0-9]/g,'');
      if(j.note){const n=$('#cs-note');if(!n.value)n.value=j.note;}
      $('#cs-upstate').textContent='✅ AI 提取完成，请核对后保存';
    }catch(err){$('#cs-upstate').textContent='⚠️ AI 提取失败，可改用本地规则提取（'+(err.message||err)+'）';}
  };
}

  </div>

function econImport(root){

    <div class="muted" style="font-size:12px;margin-bottom:10px">支持 CSV / TSV / 空格分隔 / Word 表格粘贴：首行为变量名，其后每一行一条观测</div>

  $$('[data-sel]',root).forEach(b=>b.onclick=()=>{state.econDS=b.dataset.sel;state.econStep=2;econometricsPage(root);});

function econPreprocess(root,ds){
  root.innerHTML=`
  <div class="card">
    <div class="sec-head" style="margin:0"><span class="sec-head-l"><span class="sec-head-t">步骤 2 · 数据预处理</span><span class="muted" style="font-size:12px;font-weight:400">（缺失值 / 异常值 / 标准化，按需处理）</span></span><span class="sec-head-r"><span class="chip blue">${esc(ds.name)}</span><button id="ep-undo" class="btn sm" style="margin-left:8px">↩ 撤销预处理</button></span></div>
    <div class="set-row"><div><div class="lbl">缺失值处理</div><div class="desc">当前缺失：${ds.rows.filter(r=>numericCols(ds).some(c=>r[c]==='')).length} 行</div></div>
      <div class="seg"><button data-op="mm">均值填充</button><button data-op="md">中位数填充</button></div></div>
    <div class="set-row"><div><div class="lbl">异常值处理</div><div class="desc">对数值列按 1% 分位缩尾（winsorize）</div></div>
      <div class="seg"><button data-op="w1">缩尾 1%</button><button data-op="w5">缩尾 5%</button></div></div>
    <div class="set-row"><div><div class="lbl">标准化</div><div class="desc">z-score（均值 0，标准差 1）</div></div>
      <div class="seg"><button data-op="z">z-score</button><button data-op="mmx">min-max 0-1</button></div></div>
  </div>
  <div class="card" style="margin-top:12px"><h3>数据预览（前 8 行）</h3><div class="table-wrap"><table class="data"><tr>${ds.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${ds.rows.slice(0,8).map(r=>'<tr>'+ds.headers.map(h=>`<td>${typeof r[h]==='number'?r[h].toFixed(2):esc(r[h])}</td>`).join('')+'</tr>').join('')}</table></div></div>
  <div style="margin-top:12px"><button id="ep-next" class="btn primary">下一步：描述/相关</button></div>`;
  $$('[data-op]',root).forEach(b=>b.onclick=()=>{
    const op=b.dataset.op;if(!ds._preUndo)ds._preUndo=JSON.parse(JSON.stringify(ds));
    const cols=numericCols(ds);
    if(op==='mm'||op==='md'){cols.forEach(c=>{const v=colVals(ds,c);const fill=op==='mm'?mean(v):median(v);ds.rows.forEach(r=>{if(r[c]==='')r[c]=fill;});});toast('缺失值已填充');}
    if(op==='w1'||op==='w5'){const q=op==='w1'?0.01:0.05;cols.forEach(c=>{const v=colVals(ds,c);const lo=quantile(v,q),hi=quantile(v,1-q);ds.rows.forEach(r=>{if(typeof r[c]==='number')r[c]=Math.min(Math.max(r[c],lo),hi);});});toast('已缩尾 '+q*100+'%');}
    if(op==='z'){cols.forEach(c=>{const v=colVals(ds,c);const m=mean(v),s=sd(v);ds.rows.forEach(r=>{if(typeof r[c]==='number')r[c]=(r[c]-m)/s;});});toast('已 z-score 标准化');}
    if(op==='mmx'){cols.forEach(c=>{const v=colVals(ds,c);const mn=Math.min(...v),mx=Math.max(...v);ds.rows.forEach(r=>{if(typeof r[c]==='number')r[c]=(r[c]-mn)/(mx-mn||1);});});toast('已 min-max 标准化');}
    ds.updatedAt=Date.now();const list=Store.get(K.econ,[]);Store.set(K.econ,list.map(d=>d.id===ds.id?ds:d));
    econPreprocess(root,ds);
  });
  $('#ep-undo').onclick=()=>{if(!ds._preUndo)return toast('暂无可撤销的预处理操作');const bak=ds._preUndo;delete ds._preUndo;bak._preUndo=null;Object.keys(ds).forEach(k=>delete ds[k]);Object.assign(ds,bak);Store.set(K.econ,Store.get(K.econ,[]).map(d=>d.id===ds.id?ds:d));toast('已撤销全部预处理，恢复进入本步时的初始数据');econPreprocess(root,ds);};
  $('#ep-next').onclick=()=>{state.econStep=3;econometricsPage(root);};
}
function econDesc(root,ds){
  const cols=numericCols(ds);
  const stats=cols.map(c=>{const v=colVals(ds,c);return{c,v,n:v.length,miss:ds.rows.length-v.length,m:mean(v),sd:sd(v),mn:Math.min(...v),p25:quantile(v,.25),med:median(v),p75:quantile(v,.75),mx:Math.max(...v)};});
  const corr=cols.map(c1=>cols.map(c2=>pearson(colVals(ds,c1),colVals(ds,c2))));
  root.innerHTML=`
  <div class="card"><div class="sec-head" style="margin:0"><span class="sec-head-l"><span class="sec-head-t"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;vertical-align:-2px"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span style="margin-left:2px"></span> 步骤 3 · 描述性统计与相关分析</span><span class="muted" style="font-size:12px;font-weight:400">（变量均值 / 标准差 / 相关系数矩阵）</span></span><span class="sec-head-r"><span class="chip blue">${esc(ds.name)}</span></span></div>
    <div class="table-wrap"><table class="data"><tr><th class="l">变量</th><th>N</th><th>缺失</th><th>均值</th><th>标准差</th><th>最小</th><th>p25</th><th>中位数</th><th>p75</th><th>最大</th></tr>
    ${stats.map(s=>`<tr><td class="l">${esc(s.c)}</td><td>${s.n}</td><td>${s.miss}</td><td>${s.m.toFixed(3)}</td><td>${s.sd.toFixed(3)}</td><td>${s.mn.toFixed(3)}</td><td>${s.p25.toFixed(3)}</td><td>${s.med.toFixed(3)}</td><td>${s.p75.toFixed(3)}</td><td>${s.mx.toFixed(3)}</td></tr>`).join('')}
    </table></div>
    ${cols.length?`<div style="margin-top:16px"><h3 style="font-size:14px;font-weight:600;margin-bottom:8px">均值对比柱状图</h3>${svgBars(stats.map(s=>({label:s.c,value:s.m})))}</div>`:''}
  </div>
  <div class="card" style="margin-top:12px"><h3>相关系数矩阵（Pearson）</h3>
    <div class="table-wrap"><table class="data"><tr><th class="l">变量</th>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>
    ${cols.map((c1,i)=>`<tr><td class="l">${esc(c1)}</td>${cols.map((c2,j)=>{const r=corr[i][j];const p=2*(1-normCdf(Math.abs(r*Math.sqrt((ds.rows.length-2)))));return`<td style="color:${Math.abs(r)>.5?'var(--accent)':''}">${r.toFixed(3)}${Math.abs(p)<.05?'*':''}</td>`;}).join('')}</tr>`).join('')}
    </table></div>

function econModel(root,ds){

  $('#em-y').onchange=()=>{const y=$('#em-y').value;const sel=[...$('#em-x').selectedOptions].map(o=>o.value).filter(v=>v!==y);$('#em-x').innerHTML=cols.filter(c=>c!==y).map(c=>`<option${sel.includes(c)?' selected':''}>${esc(c)}</option>`).join('');};

    const fit=olsFit(X2,Y);

    // 小样本完美线性拟合时 t/p 会产生 NaN/Infinity，JSON 序列化后变 null 导致后续渲染 toFixed 崩溃 → 先归一为 0/1
    fit.t=fit.t.map(v=>Number.isFinite(v)?v:0);fit.p=fit.p.map(v=>Number.isFinite(v)?v:1);fit.b=fit.b.map(v=>Number.isFinite(v)?v:0);fit.se=fit.se.map(v=>Number.isFinite(v)?v:0);fit.r2=Number.isFinite(fit.r2)?fit.r2:0;fit.n=Number.isFinite(fit.n)?fit.n:0;
    ds._ols=fit;ds._xNames=xs;ds._yName=y;const list=Store.get(K.econ,[]);Store.set(K.econ,list.map(d=>d.id===ds.id?ds:d));
    const names=['(常数)',...xs];
    $('#em-out').innerHTML=`
      <div class="table-wrap"><table class="data"><tr><th class="l">变量</th><th>系数</th><th>标准误</th><th>t 值</th><th>p 值</th></tr>
      ${fit.b.map((b,i)=>`<tr><td class="l">${names[i]}</td><td>${b.toFixed(4)}${stars(fit.p[i])}</td><td>${fit.se[i].toFixed(4)}</td><td>${fit.t[i].toFixed(3)}</td><td>${fit.p[i].toFixed(4)}</td></tr>`).join('')}
      </table></div>
      ${X2.length?`<div style="margin-top:16px"><h3 style="font-size:14px;font-weight:600;margin-bottom:8px">散点图与拟合线（${esc(xs[0])} → ${esc(y)}）</h3>${svgScatter(X2.map((r,i)=>[r[1],Y[i]]),{xName:xs[0],yName:y,b0:fit.b[0],b1:fit.b[1]})}</div>`:''}
      <div class="muted" style="margin-top:6px">N = ${fit.n}，R² = ${fit.r2.toFixed(3)}，* p&lt;0.1，** p&lt;0.05，*** p&lt;0.01</div>
      <div style="margin-top:8px"><button id="em-next" class="btn primary">下一步：结果导出</button></div>`;
    $('#em-next').onclick=()=>{state.econStep=5;econometricsPage(root);};
  };
}

/* ================= LLM 调用层（OpenAI 兼容，默认 DeepSeek） ================= */
async function llmAsk(prompt,system){
  const cfg=LLM.get();if(!cfg.enabled||!cfg.apiKey)return null;
  const base=(cfg.baseUrl||'https://api.deepseek.com/v1').replace(/\/$/,'');
  const url=base+'/chat/completions';
  const ctl=new AbortController();const tmr=setTimeout(()=>ctl.abort(),60000);
  let res;
  const _body={model:(LLM_LEGACY_MODELS.indexOf(cfg.model)>=0?'deepseek-flash':(cfg.model||'deepseek-flash')),messages:[{role:'system',content:system||'你是严谨的中文学术写作助手，输出规范、专业、可直接使用的学术文本。'},{role:'user',content:prompt}],max_tokens:8192};
  /* 思考模式：官方默认开启且强度 high，思维链按输出计费并占输出长度，故平台默认关闭；仅 DeepSeek 端点发送该参数 */
  if(String(url).indexOf('deepseek')>=0&&!cfg.thinking)_body.thinking={type:'disabled'};
  try{res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},body:JSON.stringify(_body),signal:ctl.signal});}
  finally{clearTimeout(tmr);}
  if(!res.ok)throw new Error('LLM 请求失败：HTTP '+res.status);
  const j=await res.json();return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
}

    {h:'第一章 引言',w:'引言约 15%',p:'撰写第一章引言：①研究背景与领域现状；②文献综述精要（区别于已有研究的关键 gap）；③本研究目标与假设；④研究设计概述；⑤论文结构安排。文献覆盖近 5 年 + 经典。'},
    {h:'第二章 文献综述',w:'综述约 20%',p:'撰写第二章文献综述：①按主题/方法/时间分类梳理已有研究；②现有研究的不足与争议点；③本研究在文献中的位置与贡献（创新性）。有深度、有批判，不简单罗列。'},
    {h:'第三章 研究方法',w:'方法约 20%',p:'撰写第三章研究方法：①研究设计（实验/调查/案例/混合）；②样本/对象与抽样方法（样本量 N=多少）；③数据收集工具与步骤（可复现）；④数据分析方法（统计工具/显著性水平）；⑤伦理与信效度。严谨详细。'},
    {h:'第四章 实验/分析',w:'结果约 25%',p:'撰写第四章研究结果：①按研究问题逐一呈现数据；②图表清晰规范（图 1、表 1 等，含标题与说明）；③统计显著性明确（p 值/效应量）；④与文献综述假设的对应。仅陈述客观结果，不解释。'},
    {h:'第五章 讨论',w:'讨论约 20%',p:'撰写第五章讨论：①结果是否支持假设（与已有研究比较，找异同）；②理论解释（结合文献综述中的理论框架）；③实践启示（对学科/行业的贡献）；④研究局限（样本/方法/外部效度）；⑤未来研究方向。批判性、有深度。'},
    {h:'第六章 结论',w:'结论约 5%',p:'撰写第六章结论：①核心发现 2-3 条（精炼）；②理论贡献；③实践意义；④研究边界与未来方向。简洁有力。'},
    {h:'参考文献',w:'参考文献 ≥15 篇',p:'生成期刊论文参考文献（GB/T 7714 或 APA 格式，约 15 篇即可）：近 5 年为主，中英文均可，文献真实存在、信息完整（作者/年份/期刊/卷期/页码/DOI）。与正文引用一一对应。'}
  ],
  // 教学案例：4 章（与平台默认一致：背景/特色/成效/启示，无摘要独立章）
  case: [
    {h:'背景与现状',w:'背景约 25%',p:'撰写「背景与现状」：①问题提出（一线教学痛点，真实迫切）；②国内外同类研究与实践现状（简述）；③本校/本人教学实际（学生情况/教学条件/已有基础）；④案例的研究价值与意义。问题真实、数据扎实。'},
    {h:'特色与创新',w:'做法约 35%（主战场）',p:'撰写「特色与创新」（主战场）：①教学设计核心理念（用一个理论框架如 UbD/TPACK/SOLO 串起）；②具体实施路径（分 3-5 个阶段，每阶段"理论-做法-案例"；细节有选择性，围绕主题筛选不事无巨细，并揭示做法背后的内在逻辑"为什么这样做"）；③关键创新点（教法/技术/评价/资源哪方面有突破）；④差异化与亮点（同行没有或做得不够的）。以问题为主线，有矛盾、冲突甚至"悬念"，吸引读者深入思考。'},
    {h:'成果与影响',w:'成效约 30%',p:'撰写「成果与影响」：①学生层面（成绩对比/作品/能力/兴趣前后变化）；②教师层面（教学能力/科研/获奖）；③学校层面（教研氛围/辐射推广/制度）；④数据与证据（图表/学生作品/同行评价）。用数据说话，避免空话。'},
    {h:'经验与启示',w:'启示约 10%',p:'撰写「经验与启示」：①核心经验（可复制的 3-5 条）；②普适性（适合推广的场景与条件）；③反思与不足（坦诚）；④后续研究/实践方向。给同行可借鉴的真东西。'}
  ]
};
/* 写作技巧精华（教科研论文写作技巧模块 · 生成风格约束） */
const AUTOWRITE_SKILLS = [
 '硬性指标（浙江/杭州评审）：标题不超过 20 字；摘要第三人称"目的-方法-结果-结论"四要素 150-300 字且含 3-5 关键词；标题层次用"一、/(一)/1./(1)"不超过 4 层；字数 4000-7000；忌"我认为/我觉得"等主观表述，一律用数据说话；语言要像人写的（避免 AI 套话）。',
 '字数配比（浙江一等奖经验）：引言/问题提出约 15%、概念阐释与框架建构约 10%、实施策略/实践路径约 55%（主战场，每条"说理+案例"）、实施成效约 12%、结语约 4%。',
 '理论框架：真正用理论搭建骨架（如 UbD 逆向设计、TPACK、SOLO 分类、自我决定理论等，选一个与问题最匹配的讲透并贯穿全文），不堆砌名词。',
 '"三真"原则：问题真实（一线教学痛点）、数据扎实（可核实，缺数据用 [待补充：XXX]）、创新显著（理论/方法/技术/实践有明确创新点）。',
 '2026 评审趋势：回答"做法/技术带来了什么改变、解决了什么问题"，不罗列"我用了什么工具"；尽量含实证支撑（调查/实验/案例）。'
];
const AUTOWRITE_NOHIT = 'AI 味规避（平台 27 条本地规则）：禁止套话——"随着…的发展""综上所述""具有重要意义""不仅…而且""在当前…背景下""有研究表明（无出处）""众所周知""不难发现""由此可见""在当今社会""静待花开"等；程度副词堆砌（极大地/显著提升）少用；正文破折号每段≤1 处；连接词密度适中（此外/同时/另外不连用）；用数据与具体做法代替空洞评价。';

function autoWritePage(){
  modalBox({title:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;vertical-align:-2px"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 4v4M8 13h.01M16 13h.01M9 17h6"/></svg> AI写论文',wide:true,body:`
    <div class="sec-head" style="margin-bottom:8px">
      <span class="sec-head-l"><span class="sec-head-t">AI 写论文</span><span class="muted" style="font-size:12px;font-weight:400">（4 类论文 SKILL 提示已预置，按所选类型差异化生成）</span><span id="aw-llm-state" class="llm-state-chip"></span></span>
    </div>
    <div class="muted" style="font-size:12px;margin-bottom:10px;line-height:1.7">资料越具体（数据、案例、学生作品、成绩对比）生成效果越好；缺数据 AI 会标 [待补充：XXX]；需在首页「论文完成度」启用 LLM Key。</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:10px">
      <div><label class="muted" style="display:block;margin-bottom:3px">论文类型 <span style="color:var(--danger-text)">*</span></label>
        <select id="aw-type" style="width:100%">
          <option value="research">教科研论文（推荐中职教师）</option>
          <option value="case">教学案例（4 章结构）</option>
          <option value="journal">期刊论文（学术规范）</option>
          <option value="graduation">毕业论文（本/硕）</option>
        </select></div>
      <div><label class="muted" style="display:block;margin-bottom:3px">学科</label>
        <select id="aw-subject" style="width:100%">
          <option value="">不限</option><option>建筑类</option><option>电子信息类</option><option>机械类</option><option>财经商贸类</option><option>医药卫生类</option><option>学前教育</option><option>语文</option><option>数学</option><option>英语</option><option>物理</option><option>化学</option><option>生物</option><option>历史</option><option>政治</option><option>信息技术</option><option>其他</option>
        </select>
      </div>
      <div><label class="muted" style="display:block;margin-bottom:3px">学段</label>
        <select id="aw-stage" style="width:100%">
          <option value="">不限</option><option>中职</option><option>高职</option><option>本科</option><option>研究生</option><option>中学</option><option>小学</option>
        </select>
      </div>
      <div><label class="muted" style="display:block;margin-bottom:3px">目标字数（自由输入）</label>
        <input id="aw-len" type="number" min="2000" max="30000" step="500" value="5000" style="width:100%" title="全文目标字数（字），生成时按章节比例分配">
      </div>
    </div>
    <div style="margin-bottom:10px"><label class="muted" style="display:block;margin-bottom:3px">论文题目（必填）</label>
      <input id="aw-topic" placeholder="如：基于项目化教学的中职建筑构造课程实践研究" style="width:100%">
    </div>
    <div style="margin-bottom:10px"><label class="muted" style="display:block;margin-bottom:3px">其他资料（必填 ≥200 字；可粘贴课题方案/教学反思/数据/学生作品，或上传 txt/md/word）</label>
      <textarea id="aw-source" placeholder="例如：课题方案摘要、本人教学实践数据（成绩对比、学生作品）、已发表论文/案例片段、参考文献列表等。资料越具体，生成质量越好。" style="min-height:140px"></textarea>
      <div style="margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input type="file" id="aw-files" multiple accept=".txt,.md,.docx,.doc" style="display:none">
        <button class="btn sm" id="aw-upbtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;vertical-align:-2px"><path d="M21 11.5l-8.5 8.5a6 6 0 0 1-8.5-8.5L11 5a4 4 0 0 1 5.7 5.7L10 17.4a2 2 0 0 1-2.8-2.8l6-6"/></svg><span style="margin-left:2px"></span> 上传文件（txt/md/word）</button>
        <span class="muted" style="font-size:11px">多个文件内容自动拼接到资料</span><span id="aw-flist" class="muted" style="font-size:11px"></span>
      </div>
    </div>
    <div style="margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn primary" id="aw-gen">AI 写论文（按所选类型生成）</button>
      <button class="btn" id="aw-tpl" title="不用 AI，用本地模板生成章节骨架（无需 Key）"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;vertical-align:-2px"><path d="M9 12h6M9 16h4M7 4h10a1 1 0 0 1 1 1v14l-3-2-3 2-3-2-3 2V5a1 1 0 0 1 1-1z"/></svg><span style="margin-left:2px"></span> 用本地模板生成</button>
      <span class="muted" style="font-size:11px">教科研 8 章 · 毕业论文 8 章 · 期刊 8 章 · 案例 4 章（按所选类型差异化）</span>
    </div>
    <div id="aw-progress" style="display:none;margin:10px 0;padding:10px;background:var(--card2);border-radius:8px;font-size:12px"></div>
    <div id="aw-out"></div>
  `,buttons:[{label:'关闭'}]});

  let extraSource='';
  // LLM 状态 chip（仿检索页 fr-llm-state）— 顶部"开始生成"按钮已删（底部"AI 写论文（按所选类型生成）"已足够）
  const _awCfg=LLM.get();
  const _chipEl=document.getElementById('aw-llm-state');
  if(_chipEl)_chipEl.innerHTML=_awCfg.enabled?'<span class="llm-chip on">● LLM 已启用</span>':'<span class="llm-chip off">○ 未配 Key（点此配）</span>';
  $('#aw-upbtn').onclick=()=>$('#aw-files').click();
  $('#aw-files').onchange=async e=>{
    const files=[...e.target.files];if(!files.length)return;
    $('#aw-flist').textContent='已选 '+files.length+' 个，正在读取…';
    const parts=[];
    for(const f of files){
      try{
        if(/\.(txt|md)$/i.test(f.name)) parts.push('【'+f.name+'】\n'+await f.text());
        else if(/\.docx?$/i.test(f.name)){
          const buf=await f.arrayBuffer();
          const zip=await JSZip.loadAsync(buf);
          const xml=await zip.file('word/document.xml').async('string');
          parts.push('【'+f.name+'】\n'+xml.replace(/<w:p[^>]*>/g,'\n').replace(/<[^>]+>/g,' ').replace(/[ \t]+/g,' ').replace(/\n{2,}/g,'\n').trim());
        }
        else parts.push('【'+f.name+'】（不支持格式已跳过）');
      }catch(err){parts.push('【'+f.name+' 读取失败】');}
    }
    extraSource=parts.join('\n\n');
    $('#aw-flist').textContent='已附加 '+files.length+' 个文件内容';
  };

  const _awPrompts=()=>AUTOWRITE_PROMPTS[$('#aw-type')?.value||'research']||AUTOWRITE_PROMPTS.research;
  const _awTypeName=t=>({research:'教科研论文',case:'教学案例',journal:'期刊论文',graduation:'毕业论文'})[t]||t;
  const renderEmpty=()=>{
    const ps=_awPrompts();
    let html='<div class="muted" style="font-size:12px;margin:8px 0">'+ps.length+' 个章节编辑区（按「'+_awTypeName($('#aw-type')?.value||'research')+'」结构，生成中逐章填充）：</div>';
    ps.forEach((s,i)=>{
      html+=`<div style="margin-bottom:8px"><label class="muted">${esc(s.h)}（${esc(s.w)}）</label><textarea id="aw-out-${i}" style="min-height:${i===Math.floor(ps.length/2)?200:90};font-size:13px;line-height:1.7"></textarea></div>`;
    });
    html+=`<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="aw-create" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;vertical-align:-2px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg><span style="margin-left:2px"></span> 创建文稿并打开（生成完成后可用）</button><button class="btn" id="aw-regen" style="display:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;vertical-align:-2px"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg><span style="margin-left:2px"></span> 重新生成</button></div>`;
    $('#aw-out').innerHTML=html;
    const _at=document.getElementById('aw-type');
    if(_at)_at.onchange=()=>{
      renderEmpty();
      const l=$('#aw-len');
      const defs={research:5000,case:3000,journal:8000,graduation:15000};
      if(l){const cur=parseInt(l.value)||0;const def=defs[_at.value]||5000;if(cur===5000||cur===6000)l.value=def;}
    };
    $('#aw-create').onclick=()=>{
      const title=$('#aw-topic').value.trim();
      const ps=_awPrompts();
      const _norm=n=>String(n||'').replace(/\s/g,'').replace(/^第[一二三四五六七八九十]+章/,'').replace(/[（(][^）)]*[)）]/g,'');
      const ds=getDocs();
      const d=ds.find(x=>x.id===state.docId)||ds[0];
      if(!d)return toast('未找到当前文档');
      if(title)d.title=title;
      let matched=0,added=0;
      [...document.querySelectorAll('#aw-out textarea')].forEach((ta,i)=>{
        const content=ta.value.trim();
        if(!content)return;
        const gName=ps[i]?.h||('章节'+(i+1));
        const g=_norm(gName);
        const idx=d.chapters.findIndex(ch=>{
          const p=_norm(ch.name||'');
          return g&&p&&(g.includes(p)||p.includes(g));
        });
        if(idx>=0){
          d.chapters[idx].content=(d.chapters[idx].content||'')+(d.chapters[idx].content?'\n\n':'')+content;
          matched++;
        }else{
          d.chapters.push({id:uid(),name:gName,content});
          added++;
        }
      });
      saveDocs(ds);
      closeModal();
      go('writing',{ch:0});
      toast('已填入下方章节：覆盖 '+matched+' 章、追加 '+added+' 章；打开写作页继续打磨');
    };
    $('#aw-regen').onclick=()=>$('#aw-gen').click();
  };
  renderEmpty(); // 打开弹窗即渲染编辑区（按当前类型）+ 绑定 aw-type 切换

  const tpl=()=>{
    const title=$('#aw-topic').value.trim()||'论文题目';
    renderEmpty();
    const fills={
      cover:'学校：[XX大学]　学院：[XX学院]　专业：[XX专业]\n标题：《'+title+'》\n作者：[XXX]　学号：[XXXXX]　指导教师：[XXXXX]　日期：[20XX 年 X 月]',
      abstract:'[占位] 摘要 300 字（研究背景/方法/结果/意义）+ 3-5 关键词。用「<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;vertical-align:-2px"><path d="M5 15c-1 1-1 5-1 5s4 0 5-1M15 4c3-1 6-1 6-1s0 3-1 6c-2 6-7 9-11 9L5 14c0-4 3-9 9-11z"/><circle cx="15" cy="9" r="1.5"/></svg> 一键生成全文」由 AI 生成完整内容。',
      toc:'一、封面 → P1\n二、中英文摘要 → P3\n三、目录 → P5\n四、引言 → P6\n五、文献综述 → P15\n六、理论框架与研究方法 → P22\n七、研究结果与分析 → P28\n八、讨论 → P45\n九、结论与建议 → P52\n十、参考文献 → P55\n十一、致谢 → P58\n十二、附录 → P59',
      intro:'[占位] 引言：研究背景/研究问题/目的意义/研究方法/论文结构（按目标字数 15%）。',
      literature:'[占位] 文献综述：分类总结（≥10 篇）/现有不足/创新点（按目标字数 10%）。',
      method:'[占位] 理论框架与研究方法：理论适用性/数据来源/研究设计/分析工具/可行性（10%）。',
      results:'[占位] 研究结果与分析（约 55% 主战场）：数据呈现/描述/理论结合/图表编号。',
      discussion:'[占位] 讨论（约 12%）：结果支持/可能解释/实践启示/不足与未来。',
      conclusion:'[占位] 结论（约 4%）：核心结论 3-5 条/实践建议 2-3 条/未来方向。',
      references:'[占位] 参考文献 ≥10 篇：近 5 年文献为主，中英文均可。建议用 Zotero/百度学术生成真实文献。',
      acknowledgement:'[占位] 致谢 200 字以内：导师/同学/家人。',
      appendix:'[占位] 附录：问卷（10 题）/原始数据/补充图表。',
      integration:'[占位] 整合全文 + 自查（连贯性/编号/格式统一）。'
    };
    Object.keys(fills).forEach(k=>{const el=$('#aw-out-'+k);if(el)el.value=fills[k];});

// ===== 文件解析（全局：文献页 / 案例素材共用）=====
const _loadLib=url=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=url;s.onload=res;s.onerror=()=>rej(new Error('解析库加载失败（需联网）'));document.head.appendChild(s);});
const _parseDocx=async buf=>{
  if(!window.JSZip)await _loadLib('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const zip=await window.JSZip.loadAsync(buf);
  const xml=await zip.file('word/document.xml').async('string');
  return xml.replace(/<w:p[^>]*>/g,'\n').replace(/<w:tab[^>]*>/g,'\t').replace(/<[^>]+>/g,'').replace(/\n{2,}/g,'\n').trim();
};
const _parsePdf=async buf=>{
  if(!window.pdfjsLib){
    await _loadLib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  let text='';
  const n=Math.min(pdf.numPages,60);
  for(let i=1;i<=n;i++){
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    text+=(tc.items.map(it=>it.str).join(' '))+'\n';
  }
  // 知网 CAJ 转 PDF 常逐字拆分：合并中文/全角字符间空格（英文单词间隔不受影响）
  return text.replace(/([\u3400-\u9fff\uff00-\uffef\u3000-\u303f])[ \u3000]+(?=[\u3400-\u9fff\uff00-\uffef\u3000-\u303f])/g,'$1').trim();
};

          const q=$('#lit-q-input').value.trim();
          if(!q){toast('请先在下方输入精读问题');return;}
          res=await llmAsk(`以下是文献内容（摘要/笔记/全文片段）：\n"""${text.slice(0,12000)}"""\n\n精读问题：${q}\n\n请按「精读三段式」回答（借鉴 paper-quick-reader deep-dive 协议）：\n【原文引用】从文中找到直接支撑的回答片段（引用原文并说明大致出处，如"摘要段/方法段"）；\n【批判性分析】分三点：①同意之处 agree_with（原文哪里站得住）②存疑之处 question（哪里论证不足/条件不满足）③可补充 complement（若做你的研究方向，这里还能怎么延伸）；\n【一句话回答】用 ≤40 字大白话总结答案。\n\n【防幻觉要求】只基于粘贴内容回答：原文未涉及该问题 → 明确说"原文未提及"，绝不编造。\n\n用规范学术中文输出。`,'你是严谨的学术文献精读助手。');
        }else{
          res=await llmAsk(`以下是文献笔记：\n"""${text.slice(0,12000)}"""\n\n请${kind==='sum'?'总结该文献已有的创新点（3-5 点，学术表述）':'结合文献提出 3-5 个可用的论文创新方向（每个方向给一句话理由）'}，输出规范学术中文。`,'你是严谨的学术创新咨询专家。');
        }
      }
      if(!res){
        if(kind==='deep'){
          res='【原文引用】'+(text.slice(0,60))+'…\n【批判性分析】\n① 同意之处：待从原文找支撑点\n② 存疑之处：待识别论证不足处\n③ 可补充：待结合自身研究延伸\n【一句话回答】待提炼（配 LLM Key 可自动精读）';
        }else{
          res=kind==='sum'?tplSummary(text):tplInnovation(text);
        }
      }
      out.innerHTML='<div class="card" style="background:var(--card2);white-space:pre-wrap;font-size:13px">'+esc(res)+'<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm primary" id="lit-save-note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;vertical-align:-2px"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg> 保存为文献条目</button><button class="btn sm" id="lit-copy">复制</button></div></div>';
      $('#lit-copy').onclick=()=>copyText(res);
      const sn=$('#lit-save-note');
      if(sn)sn.onclick=()=>{
        const ls=Store.get(K.lits,[]);
        const tagBy={sum:'AI 创新点总结',new:'AI 创新方向',deep:'AI 精读'}[kind]||'AI 笔记';
        let title,notes;
          const first=(text.split('\n').find(l=>l.trim())||'').replace(/^#+\s*/,'').trim();
          title=(first.slice(0,40)||'文献分析笔记').trim();
          const actName={sum:'总结本文创新点',new:'提出创新方向',deep:'文献 AI 精读'}[kind]||'AI 分析';
          const srcTxt=(text.length>12000)?text.slice(0,12000)+'\n…（原文过长，已截断前 12000 字）':text;
          notes='【分析动作】'+actName+'\n【原文】\n'+srcTxt+'\n\n【AI 结果】\n'+res;
        ls.unshift({id:uid(),title,authors:'',venue:'',year:'',doi:'',notes,tags:[tagBy],readMinutes:Math.max(1,Math.round((text||'').length/400))});
        Store.set(K.lits,ls);
        toast('已保存为文献条目：'+title.slice(0,16)+'…');
        literaturePage(root);
      };
    }catch(e){out.innerHTML='<div class="muted">'+esc(e.message)+'</div>';}
  };
  // 一排分析动作（sum/new/deep）
  const toggleQ=on=>{
    const qEl=$('#lit-q'),deepAct=root.querySelector('.lit-act[data-act="deep"]');
    if(on){qEl.style.display='block';deepAct&&deepAct.classList.add('on');setTimeout(()=>$('#lit-q-input').focus(),50);}
    else{qEl.style.display='none';deepAct&&deepAct.classList.remove('on');}
  };
  $$('.lit-act',root).forEach(c=>c.onclick=()=>{
    const act=c.dataset.act;
    if(act==='sum'){toggleQ(false);doMine('sum');}
    else if(act==='new'){toggleQ(false);doMine('new');}
    else if(act==='deep'){const qEl=$('#lit-q');const on=qEl.style.display!=='block';toggleQ(on);if(on&&!$('#lit-mine').value.trim())toast('先粘贴文献内容，再想一个具体问题');}
  });
  $('#lit-q-go').onclick=()=>doMine('deep');
  $('#lit-q-input').addEventListener('keydown',e=>{if(e.key==='Enter'){doMine('deep');}});
}

function searchPage(root){
  const q=(state._sq||'');state._sq='';
  root.innerHTML=`
  <div class="pg-banner">
    <div class="pg-banner-main">
      <div class="pg-banner-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;vertical-align:-2px"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><span style="margin-left:2px"></span> 全局搜索</div>
      <div class="pg-banner-sub">跨模块关键词全文检索（写作/文献/期刊/投稿），点击结果直达对应页面</div>
    </div>
    <svg class="pg-banner-ring" width="56" height="56" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-dasharray="20 75" stroke-linecap="round" transform="rotate(-90 18 18)"/></svg>
  </div>
  <div class="toolbar-card">
  <div class="search-box"><input id="gs-input" placeholder="输入关键词，搜索写作/文献/期刊/投稿…" value="${esc(q)}"></div>
  </div>
  <div id="gs-out"></div>`;
  const inp=$('#gs-input');inp.focus();
  const run=debounce(()=>{const kw=inp.value.trim();if(!kw){$('#gs-out').innerHTML='';return;}renderSearch(kw);},300);
  inp.addEventListener('input',run);if(q)renderSearch(q);
  function renderSearch(kw){
    const res=[];
    getDocs().forEach(d=>d.chapters.forEach((c,i)=>{const idx=c.content.indexOf(kw);if(idx>-1)res.push({g:'写作',title:d.title+' / '+c.name,text:c.content.slice(Math.max(0,idx-20),idx+40),jump:()=>{state.chIdx=i;go('writing',{ch:i});}});}));
    Store.get(K.lits,[]).forEach(l=>{if((l.title||'').includes(kw)||(l.notes||'').includes(kw))res.push({g:'文献',title:l.title,text:l.notes||'',jump:()=>go('literature')});});
    const groups={};res.forEach(r=>{groups[r.g]=groups[r.g]||[];groups[r.g].push(r);});
    $('#gs-out').innerHTML=Object.entries(groups).map(([g,items])=>`<div class="sr-group"><div class="g-title">${g} · ${items.length} 条</div>${items.map(r=>`<div class="sr-item"><div style="flex:1;min-width:0"><div style="font-weight:500">${esc(r.title)}</div><div class="muted" style="font-size:12px">…${esc(r.text)}…</div></div><button class="btn sm jump" data-i>跳转</button></div>`).join('')}</div>`).join('')||'<div class="empty">未找到包含「'+esc(kw)+'」的内容</div>';
    let i=0;$$('.sr-item .jump').forEach(b=>{const r=res[i++];b.onclick=r.jump;});
  }
}

    const nEl=document.getElementById('fbh-n');if(nEl)nEl.textContent='共 '+h2.length+' 条 · 仅存本机 · 自动记录"生成/复制/发邮件"动作';
    const body=document.getElementById('fbh-body');if(!body)return;
    body.innerHTML=h2.length
      ?'<div id="fb-hist">'+h2.slice(0,10).map((x,i)=>`<div style="padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <span class="chip ${x.act==='mail'?'amber':'gray'}">${x.act==='mail'?'已发邮件':x.act==='copy'?'已复制':'已生成'}</span>
          <span style="font-weight:600">${esc(x.mod)}</span>
          <span class="muted" style="flex:1;text-align:right">${new Date(x.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
          <button class="btn sm" data-fb-re="${i}" title="重新复制这条反馈内容">复制</button>
        </div>
        <div class="muted" style="margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.d)}</div>
      </div>`).join('')
      +'</div><div class="muted" style="font-size:11px;margin-top:6px">仅显示最近 10 条，共 '+h2.length+' 条（超出 20 条自动丢弃最旧）。</div>'
      +'<div style="margin-top:8px"><button class="btn sm danger" id="fb-hist-clear">清空记录</button></div>'
      :'<div class="muted" style="font-size:12px">还没有记录。点上方「生成反馈文本 / 一键发邮件 / 复制反馈内容」后会自动记一条，方便追溯、避免重复上报同一个问题。</div>';
    const fmtOne=h=>`【论文平台问题反馈】\n时间：${new Date(h.ts).toLocaleString('zh-CN')}\n问题类型：${h.mod}\n问题描述：${h.d}\n联系方式：${h.c||'（未填）'}`;
    const hb=$('#fb-hist');
    if(hb)$$('#fb-hist [data-fb-re]').forEach(b=>b.onclick=()=>{const h=h2[parseInt(b.dataset.fbRe)];if(h){copyText(fmtOne(h));toast('已重新复制该条反馈');}});
    const hc=$('#fb-hist-clear');
    if(hc)hc.onclick=()=>confirm2('清空全部反馈记录？仅影响本机记录，不影响已发送内容。',()=>{Store.del(FB_HIST);renderHist();toast('已清空反馈记录');});
  };
  renderHist();
  const gen=(act)=>{
    const mod=$('#fb-mod').value,d=$('#fb-desc').value.trim(),c=$('#fb-contact').value.trim();
    if(!d)return toast('请先填写问题描述');
    const env=(()=>{let kb=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);const v=localStorage.getItem(k);kb+=(k.length+(v?v.length:0))*2;}kb=Math.round(kb/1024);}catch(e){}return '版本 '+APP_VERSION+' · '+(location.protocol==='file:'?'本地打开':location.hostname)+' · '+(navigator.userAgent.match(/Chrome\/[\d.]+/)||['未知浏览器'])[0]+' · 数据约 '+kb+' KB';})();
    const txt=`【论文平台问题反馈】\n时间：${todayStr()} ${new Date().toTimeString().slice(0,5)}\n问题类型：${mod}\n问题描述：${d}\n联系方式：${c||'（未填）'}\n环境：${env}`;
    const out=$('#fb-out');out.style.display='block';out.textContent=txt;
    if(addFb(act||'gen'))renderHist();
    return txt;
  };
  $('#fb-gen').onclick=()=>gen('gen');
  $('#fb-copy').onclick=()=>{const t=gen('copy');if(t)copyText(t);};
  $('#fb-mail').onclick=()=>{
    const mod=$('#fb-mod').value,d=$('#fb-desc').value.trim(),c=$('#fb-contact').value.trim();
    if(!d)return toast('请先填写问题描述');
    const subject=encodeURIComponent('【论文平台问题反馈】'+mod);
    const env='版本 '+APP_VERSION+' · '+(location.protocol==='file:'?'本地打开':location.hostname)+' · '+(navigator.userAgent.match(/Chrome\/[\d.]+/)||['未知浏览器'])[0];
    const body=encodeURIComponent(`问题类型：${mod}\n问题描述：${d}\n联系方式：${c||'（未填）'}\n环境：${env}\n\n（来自论文写作工作台问题反馈页）`);
    if(addFb('mail'))renderHist();
    window.location.href=`mailto:${AUTHOR_EMAIL}?subject=${subject}&body=${body}`;
    toast('已唤起邮件程序，点发送即可');
  };
}

   </details>`;
  };
  root.innerHTML=`
  <div class="pg-banner">
    <div class="pg-banner-main">
      <div class="pg-banner-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;vertical-align:-2px"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5c-.7.6-1 1.3-1 2.5h-6c0-1.2-.3-1.9-1-2.5A6 6 0 0 1 12 3z"/></svg><span style="margin-left:2px"></span> 教科研论文写作技巧</div>

        tipsPage(root);
        toast('已删除「'+title.slice(0,16)+'…」');
      });
      return;
    }
    confirm2('确定删除「'+title+'」？只是本机隐藏，随时可在页面顶部「恢复全部」找回。',()=>{
      const h=Store.get(K.tipsHidden,[]);
      if(!h.includes(title))h.push(title);

      tipsPage(root);
      toast('已隐藏「'+title.slice(0,16)+'…」');

  });

        <div><label class="muted" style="display:block;margin-bottom:3px;font-size:12px">来源（可选：出处/作者/日期）</label><input id="tips-a-src" placeholder="例如：2026-09 校内教研会记录" style="width:100%"></div>
        <div><label class="muted" style="display:block;margin-bottom:3px;font-size:12px">正文 <span style="color:var(--danger-text)">*</span>（直接写内容，空行分段，或从下方文件导入）</label><textarea id="tips-a-body" placeholder="把要收藏的经验直接写在这里，或点下方按钮从 Word/PDF 导入…" style="width:100%;min-height:180px;box-sizing:border-box"></textarea></div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><button type="button" id="tips-a-up" class="btn sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;vertical-align:-2px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg><span style="margin-left:2px"></span> 从 Word/PDF 导入正文</button><input type="file" id="tips-a-file" accept=".pdf,.docx,.txt,.md" style="display:none"><span class="muted" style="font-size:11px">docx/pdf/txt/md 自动读文字（联网解析；扫描版 PDF 需先 OCR；.doc 请用 WPS 另存为 docx）</span></div>

      buttons:[
        {label:'取消'},
        {label:'保存',cls:'primary',keep:true,onClick:()=>{
          const title=$('#tips-a-title').value.trim();
          const body=$('#tips-a-body').value.trim();
          if(!title)return toast('请填写标题');
          if(!body)return toast('请填写正文内容');
          const src=$('#tips-a-src').value.trim();
          const arr=Store.get(K.tipsCustom,[]);
          arr.push({title,src,body,ts:Date.now(),custom:true});
          Store.set(K.tipsCustom,arr);
          closeModal();
          tipsPage(root);
          toast('已添加「'+title.slice(0,20)+'」，显示在列表最前');
        }}
      ]
    });
    setTimeout(()=>{const t=$('#tips-a-title');if(t)t.focus();
      const up=$('#tips-a-up'),fi=$('#tips-a-file');
      if(up&&fi)up.onclick=()=>fi.click();
      if(fi)fi.onchange=async e=>{
        const f=e.target.files[0];if(!f)return;
        const label=up?up.innerHTML:'';if(up){up.disabled=true;up.textContent='解析中…';}
        try{
          const ext=(f.name.split('.').pop()||'').toLowerCase();
          let text='';
          if(ext==='txt'||ext==='md')text=(await f.text()).trim();
          else if(ext==='docx')text=await _parseDocx(await f.arrayBuffer());
          else if(ext==='pdf')text=await _parsePdf(await f.arrayBuffer());
          else{toast('暂不支持 .'+ext+'：请用 WPS 另存为 docx/txt/md 后导入');return;}
          if(!text||text.length<10){toast('未提取到有效文本（扫描版 PDF 需先 OCR 成文字）');return;}
          const tt=$('#tips-a-title'),bb=$('#tips-a-body');

          toast('已从文件读取 '+text.length+' 字：标题与正文已填入，可删改后保存');
        }catch(err){toast('解析失败：'+err.message);}
        finally{if(up){up.disabled=false;up.innerHTML=label;}if(e.target)e.target.value='';}
      };
    },50);
  };
  const rb=$('#tips-restore');
  if(rb)rb.onclick=()=>{Store.set(K.tipsHidden,[]);tipsPage(root);toast('已恢复全部技巧');};

  custom2: { name: '自定义模板2', desc: '独立一套字号/字体/行距规则，点右侧「自定义此模板」修改', rules: null },
  custom3: { name: '自定义模板3', desc: '独立一套字号/字体/行距规则，点右侧「自定义此模板」修改', rules: null },
  custom4: { name: '自定义模板4', desc: '独立一套字号/字体/行距规则，点右侧「自定义此模板」修改', rules: null },

};

function autoformatPage(root){
  const cfg = LLM.get();
  const st = Settings.get();
  // 默认模板
  if (!st.formatTemplate) st.formatTemplate = 'academic';
  if (st.formatTemplate === 'custom') st.formatTemplate = 'custom1';   // v1 老值迁移
  // v2.0：自定义模板单槽 → 5 个独立槽位 custom1..custom5
  if (!st.customRules) st.customRules = {};
  // 老用户已配规则迁到 1 号：v1 老键名映射到 v2 规则键，避免 schema 不符导致模板丢失
  if (st.format && !st.customRules.custom1) {
    const o = st.format || {};
    const m = { tSize:'titleSize', tFont:'titleFont', h1:'h1Size', h1f:'h1Font', h2:'h2Size', h2f:'h2Font', bSize:'bodySize', bFont:'bodyFont', aSize:'abstractSize', aFont:'abstractFont', rSize:'refSize', rFont:'refFont', line:'line', lineRule:'lineRule' };
    const nm = {};
    for (const k in o) { const nk = m[k] || (Object.values(m).includes(k) ? k : null); if (nk) nm[nk] = o[k]; }
    // 以学术模板为基底补齐 v2 新增键（abstractSize/refSize/h1Size 等），保证 schema 完整、弹窗与导出不空
    const base = JSON.parse(JSON.stringify(TEMPLATE_PRESETS.academic.rules));
    st.customRules.custom1 = Object.assign(base, Object.keys(nm).length ? nm : o);
  }
  Settings.save(st);

  // 取模板规则：academic/zhejiang 用平台预设；custom1..5 用各自独立存储（未配置时以学术模板为起点）
  const rulesOf = (key) => {
    const all = Settings.get().customRules || {};
    if (all[key]) return all[key];

    <!-- 区块 1：功能区 -->

      <div class="sec-head" style="margin-bottom:6px">

      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">

  // <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;vertical-align:-2px"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.5 2.5M16.5 16.5L19 19M19 5l-2.5 2.5M7.5 16.5L5 19"/></svg> 自定义模板规则（弹窗：中文字段表单，编辑当前模板的排版规则）
  $('#af-customize').onclick=()=>{

      <div style="max-height:430px;overflow-y:auto;padding-right:4px">
        ${fieldHtml}

    `,buttons:[
      {label:'取消'},
      {label:'恢复默认',cls:'',keep:true,onClick:()=>{
        const def=((TEMPLATE_PRESETS[key]||{}).rules) || TEMPLATE_PRESETS.academic.rules;
        FIELDS.forEach(f=>{const el=document.getElementById('afc-'+f.k);if(el)el.value=def[f.k]==null?'':String(def[f.k]);});
        toast(/^custom\d+$/.test(key) ? '已恢复为学术模板起始值（未保存，点保存生效）' : '已恢复默认（未保存，点保存生效）');
      }},
      {label:'保存',cls:'primary',keep:true,onClick:()=>{
        for(const f of FIELDS){
          if(!f.t){ // 非字体/行距下拉 = 数字字段
            const el=document.getElementById('afc-'+f.k);

        toast('已保存「'+presetName+'」自定义规则，排版预览会立即使用新规则');

  // 导入文档（与 AI降重一致：txt/md/csv 直读，docx 走 fileToText 解析正文）
  $('#af-import').onclick = () => $('#af-file').click();

  // 排版预览：统一逐行解析（md 与纯文本均可识别标题/摘要/参考文献/表格）
  $('#af-format').onclick = () => {

  // 导出 Markdown（结构化 md，可直接对话转 Word）
  function getFormatted() {
    const text = $inp.value.trim();
    if (!text) return null;
    const tpl = $('#af-template').value;
    const rules = rulesOf(tpl);
    return blocksToMd(parseDocBlocks(text), rules, tpl);
  }

  $('#af-export-md').onclick = () => {
    const out = getFormatted();
    if (!out) { toast('请先粘贴文本'); return; }
    const tplName = TEMPLATE_PRESETS[$('#af-template').value].name;
    const docs = Store.get(K.docs, []);
    const cur = docs.find(d => d.id === state.docId);
    const fname = (cur?.title || '论文') + '_' + tplName + '.md';

  $('#af-export-txt').onclick = () => {
    const out = getFormatted();
    if (!out) { toast('请先粘贴文本'); return; }
    // 去掉 markdown 标记与注释头；表格行（| a | b |）转去竖线纯文本
    const txt = out.replace(/^<!--[\s\S]*?-->\s*/gm, '').replace(/^#{1,6}\s+/gm, '').replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
      .split('\n').map(l => /^\s*\|/.test(l) ? l.replace(/^\s*\|\s*/, '').replace(/\s*\|\s*$/, '').replace(/\s*\|\s*/g, '　') : l).join('\n');
    const tplName = TEMPLATE_PRESETS[$('#af-template').value].name;
    const docs = Store.get(K.docs, []);
    const cur = docs.find(d => d.id === state.docId);
    const fname = (cur?.title || '论文') + '_' + tplName + '.txt';
    download(fname, txt, 'text/plain;charset=utf-8');

  /* ============ AI排版核心引擎（方案A：统一逐行解析，四端同源） ============
     背景：旧引擎"按空行切块 + md标记二次猜测"导致 Word 粘贴(无空行)整篇成 1-2 大块，
     中文序号「一、」「（一）」全识别不出、行首数字正文句被误当 h1、裸"摘要/参考文献"不认。
     方案A：一次逐行扫描 → blocks[]，预览(md) / 导出 md / 导出 txt / 导出 Word 全部
     从同一份 blocks 渲染，任何一端都不再二次乱猜。 */

  // ---- 第 1 步：逐行启发式解析为结构化块 ----
  // 返回 [{t:'title'|'h1'|'h2'|'h3'|'p'|'abs'|'refhead'|'ref'|'caption'|'table', d:'原文/多行'}]
  function parseDocBlocks(text){
    const blocks = [];
    let pending = [], absLines = [], refLines = [], tblLines = [], titleBuf = [];
    let inAbs = false, inRef = false;
    const flushP   = () => { if(pending.length){ blocks.push({t:'p', d:pending.join('\n')}); pending = []; } };
    const flushAbs = () => { if(absLines.length){ blocks.push({t:'abs', d:absLines.join('\n')}); absLines = []; } inAbs = false; };
    const flushRef = () => { if(refLines.length){ refLines.forEach(d=>blocks.push({t:'ref', d})); refLines = []; } inRef = false; };
    const flushTbl = () => { if(tblLines.length){ blocks.push({t:'table', d:tblLines.join('\n')}); tblLines = []; } };
    const flushTitle = () => { if(titleBuf.length){ titleBuf.forEach(d=>blocks.push({t:'title', d})); titleBuf = []; } };
    const lines = text.replace(/\r/g,'').split('\n');
    for(const raw of lines){
      const t = raw.trim();
      if(!t){ flushP(); flushAbs(); flushRef(); flushTbl(); continue; }
      if(/^\d{1,4}$/.test(t)) continue;                        // 页码占位
      // 题目区：正文开始前的连续短行（≤50字/无句末标点/无序号/非摘要词）收进 titleBuf
      if(blocks.length===0 && pending.length===0 && t.length<=50
         && !/[。；！？]$/.test(t) && !/^【/.test(t) && !/^#{1,6}\s/.test(t)
         && !/^(摘要|关键词)\s*[:：]/.test(t)
         && !/^[一二三四五六七八九十百]+[、．.]/.test(t) && !/^[（(][一二三四五六七八九十百]+[）)]/.test(t)){
        titleBuf.push(t); continue;
      }
      flushTitle(); // 本行已不是题目候选 → 把开头题目区先落块
      // 摘要：裸「摘要：」或「【摘要】」开段，至「关键词」收束
      if(!inAbs && /^(【摘要】|摘要\s*[:：])/.test(t)){ flushP(); flushTbl(); inAbs = true; absLines = [t]; continue; }
      if(inAbs && /^(【关键词】|关键词\s*[:：])/.test(t)){ flushAbs(); blocks.push({t:'abs', d:t}); continue; }
      if(inAbs){ absLines.push(t); continue; }
      // 孤立「关键词：」行（前面没有摘要也能识别）：按摘要区格式独立成块，避免落成正文
      if(/^【关键词】|^关键词\s*[:：]/.test(t)){ flushP(); flushTbl(); blocks.push({t:'abs', d:t}); continue; }
      // 参考文献：裸「参考文献」或「【参考文献】」
      if(!inRef && /^(【参考文献】|参考文献\s*[:：]?$)/.test(t)){ flushP(); flushTbl(); inRef = true; blocks.push({t:'refhead', d:t}); continue; }
      if(inRef){ if(/^\S/.test(t)){ refLines.push(t); continue; } }
      // 表格：行首|行尾|或 ≥3 个 |（连续行聚成 table 块；分隔行 |---|---| 跳过）
      if((t.charAt(0)==='|' && t.charAt(t.length-1)==='|' && t.split('|').length>=3) || (/^\|?[\s:|-]+\|[\s:|-]+\|?$/.test(t) && t.split('|').length>=3)){
        if(/^\|[\s:|-]+\|[\s:|-]+\|$/.test(t)) continue;
        flushP(); flushAbs(); flushRef(); tblLines.push(t); continue;
      }
      // md 标题（若输入本身带 #）
      const mh = /^#{1,6}\s+(.*)$/.exec(t);
      if(mh){
        const lv = mh[0].match(/^#+/)[0].length, content = mh[1].trim();
        flushP(); flushAbs(); flushRef(); flushTbl();
        if(lv === 1 && blocks.length === 0 && !/^[一二三四五六七八九十百]+[、．.]/.test(content)) blocks.push({t:'title', d:content});
        else if(lv <= 2) blocks.push({t:'h1', d:content});   // ## → 一级（一、级）
        else if(lv === 3) blocks.push({t:'h2', d:content});  // ### → 二级（（一）级）
        else if(lv === 4) blocks.push({t:'h3', d:content});  // #### → 三级（1. 级）
        else blocks.push({t:'p', d:content});
        continue;
      }
      // 一级：一、 二、 …
      if(/^[一二三四五六七八九十百]+[、．.]/.test(t)){ flushP(); flushAbs(); flushRef(); flushTbl(); blocks.push({t:'h1', d:t}); continue; }
      // 二级：（一）（二）…
      if(/^[（(][一二三四五六七八九十百]+[）)]/.test(t)){ flushP(); flushAbs(); flushRef(); flushTbl(); blocks.push({t:'h2', d:t}); continue; }
      // 三级/条目：1.xxx —— 数字.数字(如3.5倍)→正文；行内含句号或超长→正文(行首数字的正文句)；短短语→h3
      const dm = /^(\d{1,2})[、．.]\s*(.*)$/.exec(t);
      if(dm && !/^\d+\.\d/.test(t)){
        const rest = dm[2];
        if(rest.length <= 40 && !/[。；]/.test(rest)){ flushP(); flushAbs(); flushRef(); flushTbl(); blocks.push({t:'h3', d:t}); continue; }
      }
      // 图题/表题：图1 xxx / 表2 xxx
      if(/^[图表]\d+/.test(t)){ flushP(); flushAbs(); flushRef(); flushTbl(); blocks.push({t:'caption', d:t}); continue; }
      pending.push(t);
    }
    flushP(); flushAbs(); flushRef(); flushTbl(); flushTitle();
    return blocks;
  }

  // ---- 第 2 步 A：blocks → Markdown 预览/导出文本 ----
  function blocksToMd(blocks, rules, tplName){
    const out = [];
    // 注：不再向 md 顶部注入 HTML 注释头（此前导致预览/导出把内部注释当正文显示）；模板/字号信息由 .doc 导出携带
    out.push('');
    for(const b of blocks){
      const d = b.d;
      if(b.t === 'title') out.push('# ' + d);
      else if(b.t === 'h1') out.push('## ' + d);
      else if(b.t === 'h2') out.push('### ' + d);
      else if(b.t === 'h3') out.push('#### ' + d);
      else if(b.t === 'p' && d.includes('\n')){
        // 无空行连续正文：每行独立成段（与 Word 端逐行分段一致），避免 md/txt 预览与导出合成大段
        d.split('\n').forEach(l => { if(l.trim()){ out.push(l); out.push(''); } });
        continue;
      }
      else out.push(d);
      out.push('');
    }
    return out.join('\n');
  }

  // ---- 第 2 步 B：blocks → Word 兼容 .doc（HTML 包装，WPS/Word 直接打开，套模板字体）----
  function blocksToWordHtml(blocks, rules){
    const pt = v => ((parseFloat(v)||21)/2).toFixed(1); // 规则值 = pt×2
    const fTitle = rules.titleFont||'黑体', fBody = rules.bodyFont||'宋体', fH1 = rules.h1Font||'黑体', fH2 = rules.h2Font||'楷体', fAbs = rules.abstractFont||'仿宋', fRef = rules.refFont||'楷体';
    const aSize = pt(rules.abstractSize||rules.bodySize), rSize = pt(rules.refSize||rules.bodySize);
    const tSize = pt(rules.titleSize), h1Size = pt(rules.h1Size), h2Size = pt(rules.h2Size), bSize = pt(rules.bodySize);
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const inline = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<i>$1</i>');
    let html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>'
      + '@page{size:21cm 29.7cm;margin:2.54cm 3.17cm}'
      + 'body{font-family:'+fBody+';font-size:'+bSize+'pt;line-height:'+((parseFloat(rules.line)||360)/240)+'}'
      + 'p{margin:0 0 3pt;text-indent:2em;font-family:'+fBody+';font-size:'+bSize+'pt}'
      + 'p.title{text-align:center;font-family:'+fTitle+';font-size:'+tSize+'pt;font-weight:bold;text-indent:0;margin:6pt 0 12pt}'
      + 'h1{font-family:'+fH1+';font-size:'+h1Size+'pt;font-weight:bold;text-indent:0;margin:8pt 0 4pt}'
      + 'h2{font-family:'+fH2+';font-size:'+h2Size+'pt;font-weight:bold;text-indent:0;margin:6pt 0 3pt}'
      + 'h3{font-family:'+fH2+';font-size:'+h2Size+'pt;font-weight:bold;text-indent:0;margin:4pt 0 2pt}'
      + 'p.abs{font-family:'+fAbs+';font-size:'+aSize+'pt;margin:3pt 0}'
      + 'p.caption{text-align:center;font-family:'+fH1+';font-size:'+bSize+'pt;text-indent:0;margin:6pt 0 3pt}'
      + 'p.refhead{font-family:'+fRef+';font-size:'+rSize+'pt;font-weight:bold;text-indent:0;margin:8pt 0 3pt}'
      + 'p.ref{font-family:'+fRef+';font-size:'+rSize+'pt;text-indent:0;margin:2pt 0}'
      + 'table{border-collapse:collapse;margin:6pt auto;font-size:'+bSize+'pt}td,th{border:1px solid #000;padding:2pt 5pt;text-align:center}'
      + '</style></head><body>';
    for(const b of blocks){
      if(b.t === 'title') html += '<p class="title">' + esc(b.d) + '</p>';
      else if(b.t === 'h1' || b.t === 'h2' || b.t === 'h3') html += '<' + b.t + '>' + esc(b.d) + '</' + b.t + '>';
      else if(b.t === 'abs' || b.t === 'caption' || b.t === 'refhead') html += '<p class="' + b.t + '">' + inline(b.d) + '</p>';
      else if(b.t === 'ref') html += '<p class="ref">' + esc(b.d) + '</p>';
      else if(b.t === 'table'){ // 表格：多行 |a|b| → <table>
        const rows = b.d.split('\n').map(r => r.replace(/^\||\|$/g,'').split('|').map(c => c.trim()));
        html += '<table>' + rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</table>';
      }
      else { // p：正文可能含多行（无空行连续正文），每行一段
        b.d.split('\n').forEach(l => { if(l.trim()) html += '<p>' + inline(l) + '</p>'; });
      }
    }
    html += '</body></html>';
    return html;
  }

  $('#af-export-word').onclick = () => {
    const text = $inp.value.trim();
    if (!text) { toast('请先粘贴文本'); return; }
    const tpl = $('#af-template').value;
    const rules = rulesOf(tpl);
    const docs = Store.get(K.docs, []);
    const cur = docs.find(d => d.id === state.docId);
    const fname = (cur?.title || '论文') + '_' + TEMPLATE_PRESETS[tpl].name + '.doc';
    download(fname, blocksToWordHtml(parseDocBlocks(text), rules), 'application/msword;charset=utf-8');
    toast('已导出 Word：' + fname + '（用 WPS/Word 打开）');
  };

  // 复制排版结果按钮已删除（与方案A布局调整同步）
}

/* ================= 今日面板 ================= */
function toggleToday(){
  const p=$('#today-panel');p.classList.toggle('open');if(!p.classList.contains('open'))return;
  const items=[];
  const today=todayStr();
  Store.get(K.contests,[]).forEach(c=>{
    if(c.done||!c.deadline)return;
    if(c.deadline<today)items.push({t:'逾期评比：'+c.name+'（截止 '+c.deadline+'）',page:'submission'});
    else if(c.deadline<=addDays(today,7))items.push({t:'临近评比：'+c.name+'（截止 '+c.deadline+'）',page:'submission'});
  });
  const doc=getCurDoc();
  if(doc){doc.chapters.forEach((c,i)=>{if(!countWords(c.content).total)items.push({t:'未撰写：'+c.name,page:'writing',p:{ch:i}});});}
  if(!LLM.get().enabled)items.push({t:'未配置 LLM Key，AI 功能为模板模式',page:'settings'});
  const n=Object.keys(K).reduce((s,k)=>{const v=Store.get(K[k]);return s+(Array.isArray(v)?v.length:0);},0);
  if(n>=30)items.push({t:'数据已积累 '+n+' 条，建议导出备份',page:'settings'});
  p.innerHTML='<div style="font-weight:600;margin-bottom:6px">今日要处理</div>'+(items.length?items.map((it,i)=>`<div class="tp-item"><span style="color:var(--accent)">▸</span><span style="flex:1">${esc(it.t)}</span><button class="btn sm" data-i="${i}">处理</button></div>`).join(''):'<div class="muted" style="font-size:13px;padding:8px 0">今天没有待处理事项 🎉</div>');
  $$('.tp-item button').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i];p.classList.remove('open');if(it.page==='writing'&&it.p)state.chIdx=it.p.ch;go(it.page);});
}

/* ================= 初始化 ================= */
function applyLayout(){const st=Settings.get();const l=st.layout||'standard';document.documentElement.dataset.layout=l;const sel=$('#layout-select');if(sel)sel.value=l;}
function init(){
  /* 调试：捕获 init 抛错显示到 #content */
  try{
  /* 版本检测：浏览器缓存了旧版平台时提示强制刷新（治缓存问题的关键） */
  try{
    const savedV=localStorage.getItem('wb_version');
    if(savedV&&savedV!==APP_VERSION){
      setTimeout(()=>toast('📢 平台已更新到 '+APP_VERSION+' 版，当前可能是旧缓存——请按 Ctrl+F5（手机：浏览器清除缓存或换无痕模式）强制刷新'),800);
    }
    localStorage.setItem('wb_version',APP_VERSION);
  }catch(e){}
  ensureData();Settings.get();applyTheme();applyLayout();renderNav();
  if(window.__llmMigrated)setTimeout(()=>toast('DeepSeek 模型名已自动升级为 deepseek-flash（V4.1 Flash，更快更省）'),900);
  $('#hamburger').onclick=openDrawer;
  $('#drawer-mask').onclick=closeDrawer;
  $('#search-input').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(q){state._sq=q;e.target.value='';go('search');}}});
  $('#layout-select').onchange=()=>{const st=Settings.get();st.layout=$('#layout-select').value;Settings.save(st);applyLayout();toast('页面风格：'+({'standard':'标准','compact':'紧凑','spacious':'宽松'}[st.layout]||st.layout));};
  $('#today-btn').onclick=toggleToday;
  // 初始页：支持 #page 直达（如 #writing），也兼容旧 #/page
  const hp=location.hash.replace('#/','').replace('#','');
  const hpClean=hp.replace(/^\//,'');
  go(NAV.find(n=>n.id===hpClean)?hpClean:'progress');
  }catch(e){const c=$('#content');if(c)c.innerHTML='<div class="empty" style="padding:20px;color:var(--danger-text);font-size:13px">⚠️ 页面初始化错误<br><pre style="font-size:11px;background:var(--card2);padding:10px;border-radius:6px;white-space:pre-wrap;margin-top:8px">'+e.stack+'</pre></div>';}
}
init();
