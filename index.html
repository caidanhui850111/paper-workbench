      <textarea id="aw-source" placeholder="例如：课题方案摘要、本人教学实践数据（成绩对比、学生作品）、已发表论文/案例片段、参考文献列表等。资料越具体，生成质量越好。" style="min-height:140px"></textarea>
      <div style="margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input type="file" id="aw-files" multiple accept=".txt,.md,.docx,.doc" style="display:none">
        <button class="btn sm" id="aw-upbtn">📎 上传文件（txt/md/word）</button>
        <span class="muted" style="font-size:11px">多个文件内容自动拼接到资料</span><span id="aw-flist" class="muted" style="font-size:11px"></span>
      </div>
    </div>
    <div style="margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn primary" id="aw-gen">🚀 一键生成全文（逐章）</button>
      <button class="btn" id="aw-tpl">📋 用本地模板（无需 Key）</button>
      <span class="muted" style="font-size:11px">约 3-6 分钟，13 章逐章生成</span>
    </div>
    <div id="aw-progress" style="display:none;margin:10px 0;padding:10px;background:var(--card2);border-radius:8px;font-size:12px"></div>
    <div id="aw-out"></div>
  `,buttons:[{label:'关闭'}]});

  let extraSource='';
  $('#aw-upbtn').onclick=()=>$('#aw-files').click();
  $('#aw-files').onchange=async e=>{
    const files=[...e.target.files];if(!files.length)return;
    $('#aw-flist').textContent='已选 '+files.length+' 个，正在读取…';
    const parts=[];
    for(const f of files){
      try{
        if(/\.(txt|md)$/i.test(f.name)) parts.push('【'+f.name+'】\n'+await f.text());
        else if(/\.docx?$/i.test(f.name)){
          const buf=await f.arrayBuffer();
          const zip=await JSZip.loadAsync(buf);
          const xml=await zip.file('word/document.xml').async('string');
          parts.push('【'+f.name+'】\n'+xml.replace(/<w:p[^>]*>/g,'\n').replace(/<[^>]+>/g,' ').replace(/[ \t]+/g,' ').replace(/\n{2,}/g,'\n').trim());
        }
        else parts.push('【'+f.name+'】（不支持格式已跳过）');
      }catch(err){parts.push('【'+f.name+' 读取失败】');}
    }
    extraSource=parts.join('\n\n');
    $('#aw-flist').textContent='已附加 '+files.length+' 个文件内容';
  };

  const renderEmpty=()=>{
    const titles=['封面','中英文摘要','目录','引言/绪论','文献综述','理论框架与研究方法','研究结果与分析','讨论','结论与建议','参考文献','致谢','附录','整合说明'];
    const keys=['cover','abstract','toc','intro','literature','method','results','discussion','conclusion','references','acknowledgement','appendix','integration'];
    let html='<div class="muted" style="font-size:12px;margin:8px 0">13 个章节编辑区（生成中会逐章填充）：</div>';
    keys.forEach((k,i)=>{
      html+=`<div style="margin-bottom:8px"><label class="muted">${titles[i]}</label><textarea id="aw-out-${k}" style="min-height:${i===6?200:90};font-size:13px;line-height:1.7"></textarea></div>`;
    });
    html+=`<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="aw-create" disabled>📄 创建文稿并打开（生成完成后可用）</button><button class="btn" id="aw-regen" style="display:none">🔄 重新生成</button></div>`;
    $('#aw-out').innerHTML=html;
    $('#aw-create').onclick=()=>{
      const title=$('#aw-topic').value.trim();
      const names=['一、封面','二、中英文摘要','三、目录','四、引言','五、文献综述','六、理论框架与研究方法','七、研究结果与分析','八、讨论','九、结论与建议','十、参考文献','十一、致谢','十二、附录','十三、整合说明'];
      const keys=['cover','abstract','toc','intro','literature','method','results','discussion','conclusion','references','acknowledgement','appendix','integration'];
      // 13 章 → 期望章节名映射（关键词匹配；封面/目录不填正文，整合说明追加）
      const map=[
        null, // cover 跳过
        ['摘要','摘 要'],
        null, // toc 跳过
        ['引言','绪论','问题的提出'],
        ['文献综述','文献回顾'],
        ['方法','研究方法','理论框架与研究方法','理论框架'],
        ['结果','研究结果','研究结果与分析','结果与分析'],
        ['讨论'],
        ['结论','结论与建议','结论与讨论'],
        ['参考文献'],
        ['致谢'],
        ['附录'],
        null  // integration 追加为新章节
      ];
      const ds=getDocs();
      const d=ds.find(x=>x.id===state.docId)||ds[0];
      if(!d)return toast('未找到当前文档');
      if(title)d.title=title;
      let matched=0,added=0;
      keys.forEach((k,i)=>{
        const content=$('#aw-out-'+k).value.trim();
        if(!content)return;
        const alts=map[i];
        if(alts===null){
          // 封面/目录/整合说明 → 整合说明追加为新章节，其余丢弃
          if(k==='integration'){
            d.chapters.push({id:uid(),name:names[i],content});
            added++;
          }
          return;
        }
        // 找匹配的章节
        const idx=d.chapters.findIndex(ch=>{
          const n=(ch.name||'').replace(/\s/g,'');
          return alts.some(a=>n.includes(a.replace(/\s/g,'')));
        });
        if(idx>=0){
          d.chapters[idx].content=(d.chapters[idx].content||'')+(d.chapters[idx].content?'\n\n':'')+content;
          matched++;
        }else{
          d.chapters.push({id:uid(),name:names[i],content});
          added++;
        }
      });
      saveDocs(ds);
      closeModal();
      go('writing',{ch:0});
      toast('已填入下方章节：覆盖 '+matched+' 章、追加 '+added+' 章；打开写作页继续打磨');
    };
    $('#aw-regen').onclick=()=>$('#aw-gen').click();
  };

  const tpl=()=>{
    const title=$('#aw-topic').value.trim()||'论文题目';
    renderEmpty();
    const fills={
      cover:'学校：[XX大学]　学院：[XX学院]　专业：[XX专业]\n标题：《'+title+'》\n作者：[XXX]　学号：[XXXXX]　指导教师：[XXXXX]　日期：[20XX 年 X 月]',
      abstract:'[占位] 摘要 300 字（研究背景/方法/结果/意义）+ 3-5 关键词。用「🚀 一键生成全文」由 AI 生成完整内容。',
      toc:'一、封面 → P1\n二、中英文摘要 → P3\n三、目录 → P5\n四、引言 → P6\n五、文献综述 → P15\n六、理论框架与研究方法 → P22\n七、研究结果与分析 → P28\n八、讨论 → P45\n九、结论与建议 → P52\n十、参考文献 → P55\n十一、致谢 → P58\n十二、附录 → P59',
      intro:'[占位] 引言：研究背景/研究问题/目的意义/研究方法/论文结构（按目标字数 15%）。',
      literature:'[占位] 文献综述：分类总结（≥10 篇）/现有不足/创新点（按目标字数 10%）。',
      method:'[占位] 理论框架与研究方法：理论适用性/数据来源/研究设计/分析工具/可行性（10%）。',
      results:'[占位] 研究结果与分析（约 55% 主战场）：数据呈现/描述/理论结合/图表编号。',
      discussion:'[占位] 讨论（约 12%）：结果支持/可能解释/实践启示/不足与未来。',
      conclusion:'[占位] 结论（约 4%）：核心结论 3-5 条/实践建议 2-3 条/未来方向。',
      references:'[占位] 参考文献 ≥17 篇：英文 ≥5 + 中文核心 ≥10 + 专著 2-3。建议用 Zotero/百度学术生成真实文献。',
      acknowledgement:'[占位] 致谢 200 字以内：导师/同学/家人。',
      appendix:'[占位] 附录：问卷（10 题）/原始数据/补充图表。',
      integration:'[占位] 整合全文 + 自查（连贯性/编号/格式统一）。'
    };
    Object.keys(fills).forEach(k=>{const el=$('#aw-out-'+k);if(el)el.value=fills[k];});
    $('#aw-progress').style.display='none';
    const c=$('#aw-create');if(c)c.disabled=false;
    toast('本地模板已填充，可手动编辑；配 Key 后点「🚀 一键生成全文」让 AI 生成完整内容');
  };
  $('#aw-tpl').onclick=tpl;

  $('#aw-gen').onclick=async()=>{
    const subject=$('#aw-subject').value,stage=$('#aw-stage').value,topic=$('#aw-topic').value.trim();
    const lenSel=$('#aw-len').value;
    let source=$('#aw-source').value.trim();
    if(extraSource) source=source?source+'\n\n'+extraSource:extraSource;
    if(!topic)return toast('请填写论文题目');
    if(!source||source.length<200)return toast('资料至少 200 字，请补充或上传文件');
    if(!LLM.get().enabled)return toast('请先在「设置与说明」配置 LLM Key（默认 DeepSeek）');
    const btn=$('#aw-gen');btn.disabled=true;btn.textContent='🤖 生成中…';
    const prog=$('#aw-progress');prog.style.display='block';
    renderEmpty();
    const lenDesc={3000:'3000-5000 字',5000:'5000-8000 字',8000:'8000-12000 字'}[lenSel]||'5000-8000 字';
    const meta=[subject?'学科：'+subject:'',stage?'学段：'+stage:'',topic?'论文题目：'+topic:'','目标字数：'+lenDesc+'（全文）+ 章节按比例：引言15%/概念框架10%/实施策略55%/成效12%/结语4%'].filter(Boolean).join('\n');
    const keys=['cover','abstract','toc','intro','literature','method','results','discussion','conclusion','references','acknowledgement','appendix','integration'];
    try{
      for(let i=0;i<AUTOWRITE_PROMPTS.length;i++){
        const s=AUTOWRITE_PROMPTS[i];
        prog.innerHTML='<div>⏳ 正在生成 <b>第 '+(i+1)+'/13 章：'+s.h+'</b>（'+s.w+'）…</div>';
        const chPrompt='你是浙江省教育领域资深论文指导专家，熟悉浙江获奖论文风格与教科研论文写作规范。\n【论文信息】\n'+meta+'\n\n【资料来源】\n'+source.slice(0,2500)+'\n\n【本章任务·'+s.h+'（'+s.w+'）】\n'+s.p+'\n\n【写作技巧参考（必须遵守）】\n'+AUTOWRITE_SKILLS.join('\n')+'\n'+AUTOWRITE_NOHIT+'\n\n【输出要求】仅输出本章正文内容（中文），不要标题、不要解释、不要 JSON；按目标字数与比例控制篇幅；如素材缺数据用 [待补充：XXX] 标注，不编造。';
        const r=await llmAsk(chPrompt);
        const el=$('#aw-out-'+keys[i]);if(el)el.value=(r||'').replace(/^【[^】]*】/,'').trim();
        prog.innerHTML='<div style="color:var(--ok)">✓ 第 '+(i+1)+'/13 章完成：'+s.h+'</div>';
      }
      prog.innerHTML+='<div style="color:var(--ok);margin-top:6px">✅ 全部 13 章生成完毕！可编辑后点「创建文稿并打开」</div>';
      const c=$('#aw-create');if(c)c.disabled=false;
      $('#aw-regen').style.display='inline-flex';
      btn.disabled=false;btn.textContent='🚀 一键生成全文（逐章）';
    }catch(err){
      btn.disabled=false;btn.textContent='🚀 一键生成全文（逐章）';
      prog.innerHTML='<div style="color:var(--danger)">生成中断：'+esc(err.message||err)+'。已完成的章节保留，可重试剩余或手动编辑。</div>';
    }
  };
}


function literaturePage(root){
  const lits=Store.get(K.lits,[]);
  root.innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <h3 style="font-size:15px;font-weight:600">📚 我的文献 <span class="chip gray">${lits.length} 篇</span></h3>
    <button id="lit-add" class="btn primary sm">+ 新增文献</button>
  </div>
  <div class="card" style="margin-bottom:12px;background:var(--ok-soft);border-color:var(--ok)">
    <h3 style="color:var(--ok)">💡 创新点挖掘</h3>
    <div class="muted" style="font-size:12px;margin-bottom:8px">粘贴论文笔记 / 摘要 / 链接内容，生成可用创新点（配 LLM Key 用大模型，未配用模板）</div>
    <textarea id="lit-mine" placeholder="粘贴一段论文笔记或摘要内容…" style="min-height:90px"></textarea>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
      <button id="lit-gen" class="btn primary">给我创新点</button>
      <button id="lit-sum" class="btn">总结本文创新点</button>
      <button id="lit-note" class="btn" title="按结构化模板整理文献笔记（借鉴 research-writing-skill #18 + Paper-Agent Reader）">📝 结构化笔记</button>
      <button id="lit-deep" class="btn" title="针对具体问题精读：原文引用 + 批判性分析（借鉴 paper-quick-reader 精读协议）">🎯 AI 精读</button>
      <span class="muted" id="lit-llm-state"></span>
    </div>
    <div id="lit-q" style="margin-top:8px;display:none"><input id="lit-q-input" placeholder="针对这篇文献提一个具体问题，如：这个方法能用到我的课堂上吗？"></div>
    <div id="lit-mine-out" style="margin-top:10px"></div>
  </div>
  <div id="lit-list">${lits.map(l=>`
    <div class="lit-item">
      <div class="l-title">${esc(l.title)}</div>
      <div class="l-meta">${esc(l.authors||'')} · ${esc(l.venue||'')} · ${l.year||''}${l.doi?' · DOI:'+esc(l.doi):''}</div>
      <div style="margin-bottom:6px">${(l.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${l.readMinutes?`<span class="chip green" style="margin-left:6px">已读 ${l.readMinutes} 分钟</span>`:''}</div>
      <div class="muted" style="font-size:13px">${esc(l.notes||'')}</div>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn sm" data-edit="${l.id}">编辑</button>
        <button class="btn sm" data-del="${l.id}">删除</button>
      </div>
    </div>`).join('')||'<div class="empty"><div class="big">📖</div>还没有文献，点「+ 新增文献」添加</div>'}</div>`;
  $('#lit-llm-state').textContent=LLM.get().enabled?'LLM 已启用':'未配 Key，使用本地模板';
  $('#lit-add').onclick=()=>modalBox({title:'新增文献',body:'<input id="m-lt" placeholder="论文标题"><input id="m-la" placeholder="作者" style="margin-top:8px"><input id="m-lv" placeholder="期刊/会议" style="margin-top:8px"><input id="m-ly" type="number" placeholder="年份" style="margin-top:8px"><input id="m-ld" placeholder="DOI" style="margin-top:8px"><textarea id="m-ln" placeholder="阅读笔记" style="margin-top:8px;min-height:70px"></textarea><input id="m-ltag" placeholder="标签，逗号分隔" style="margin-top:8px">',buttons:[{label:'取消'},{label:'保存',cls:'primary',onClick:()=>{const ls=Store.get(K.lits,[]);ls.unshift({id:uid(),title:$('#m-lt').value||'未命名文献',authors:$('#m-la').value,venue:$('#m-lv').value,year:$('#m-ly').value,doi:$('#m-ld').value,notes:$('#m-ln').value,tags:$('#m-ltag').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean)});Store.set(K.lits,ls);literaturePage(root);}}]});
  $$('[data-del]',root).forEach(b=>b.onclick=()=>confirm2('删除这篇文献？',()=>{Store.set(K.lits,Store.get(K.lits,[]).filter(x=>x.id!==b.dataset.del));literaturePage(root);}));
  $$('[data-edit]',root).forEach(b=>b.onclick=()=>{const l=Store.get(K.lits,[]).find(x=>x.id===b.dataset.edit);if(!l)return;modalBox({title:'编辑笔记',body:'<textarea id="m-ln2" style="min-height:120px">'+esc(l.notes||'')+'</textarea>',buttons:[{label:'取消'},{label:'保存',cls:'primary',onClick:()=>{l.notes=$('#m-ln2').value;Store.set(K.lits,Store.get(K.lits,[]).map(x=>x.id===l.id?l:x));literaturePage(root);}}]});});
  const out=$('#lit-mine-out');
  const tplInnovation=text=>`基于以上内容，建议从以下方向挖掘创新点（模板生成，配 LLM Key 可深度分析）：\n\n① 研究对象创新：选取${'被现有研究忽视的细分对象'}，补充该领域实证空白；\n② 方法创新：引入${'新方法/新数据'}，与传统方法对比验证；\n③ 视角创新：从${'交叉学科视角'}重新审视问题，提出新解释框架；\n④ 应用创新：将已有理论应用到${'新场景'}，检验其适用边界；\n⑤ 数据创新：构建${'更精细的指标/更长时段的面板数据'}，提升结论稳健性。`;
  const tplSummary=text=>`【本文创新点总结（模板）】\n1. 研究问题：${(text||'').slice(0,60)}…\n2. 核心结论：围绕上述问题给出 2-3 条主要发现；\n3. 方法贡献：方法/数据上的独特性；\n4. 实践价值：对实践或后续研究的启示。`;
  const doMine=async(kind)=>{
    const text=$('#lit-mine').value.trim();if(!text)return toast('请先粘贴内容');
    out.innerHTML='<div class="muted">生成中…</div>';
    try{
      let res;
      if(LLM.get().enabled){
        if(kind==='note'){
          res=await llmAsk(`以下是文献内容（摘要/笔记/全文片段）：\n"""${text.slice(0,3500)}"""\n\n请按结构化笔记模板整理（借鉴学术文献精读规范 + paper-quick-reader 引导关联协议）：\n【基本信息】标题/作者/来源（从文中提取，缺失标未知）\n【核心贡献】本文提出了什么新东西（1-3 点）\n【研究问题】解决什么问题，为什么重要\n【关键方法】用了什么方法/数据/样本\n【主要结论】2-3 条关键发现\n【与我研究关联】若做「{待填主题}」方向，本文可引用的点（2-3 条）。\n\n【关联点硬性要求（借鉴 paper-quick-reader）】每条关联必须：①标注类型（六选一：方法论可复用 methodology_reusable / 基线参照 baseline_reference / 研究空白 gap_identified / 数据重叠 data_overlap / 新颖性相关 novelty_related / 理论延伸 theory_extension）；②具体到「本文的 X 可用于你的 Y」，严禁空泛套话（如"本文对你的研究很有启发"这类无证据关联直接不算）；③给相关度评分 relevance_score（0-10）。\n\n【防幻觉要求】只基于粘贴内容回答：原文未提到的信息标注"原文未提及"，绝不编造页码/数据/结论。\n\n用规范学术中文，分节输出。`,'你是一位严谨的学术文献精读助手。');
        }else if(kind==='deep'){
          const q=$('#lit-q-input').value.trim();
          if(!q){toast('请先在下方输入精读问题');return;}
          res=await llmAsk(`以下是文献内容（摘要/笔记/全文片段）：\n"""${text.slice(0,3500)}"""\n\n精读问题：${q}\n\n请按「精读三段式」回答（借鉴 paper-quick-reader deep-dive 协议）：\n【原文引用】从文中找到直接支撑的回答片段（引用原文并说明大致出处，如"摘要段/方法段"）；\n【批判性分析】分三点：①同意之处 agree_with（原文哪里站得住）②存疑之处 question（哪里论证不足/条件不满足）③可补充 complement（若做你的研究方向，这里还能怎么延伸）；\n【一句话回答】用 ≤40 字大白话总结答案。\n\n【防幻觉要求】只基于粘贴内容回答：原文未涉及该问题 → 明确说"原文未提及"，绝不编造。\n\n用规范学术中文输出。`,'你是严谨的学术文献精读助手。');
        }else{
          res=await llmAsk(`以下是文献笔记：\n"""${text.slice(0,3000)}"""\n\n请${kind==='sum'?'总结该文献已有的创新点（3-5 点，学术表述）':'结合文献提出 3-5 个可用的论文创新方向（每个方向给一句话理由）'}，输出规范学术中文。`,'你是严谨的学术创新咨询专家。');
        }
      }
      if(!res){
        if(kind==='note'){
          const t=text.slice(0,80);
          res='【基本信息】标题/作者/来源：'+t+'…（待补充）\n【核心贡献】'+'待从原文提取 1-3 点核心贡献\n【研究问题】'+'待提炼本文要解决的问题\n【关键方法】'+'待提炼研究方法/数据/样本\n【主要结论】'+'待提炼 2-3 条关键发现\n【与我研究关联】'+'待结合自身研究方向补充 1-2 条引用点\n\n（模板生成，配 LLM Key 可自动精读提炼）';
        }else if(kind==='deep'){
          res='【原文引用】'+(text.slice(0,60))+'…\n【批判性分析】\n① 同意之处：待从原文找支撑点\n② 存疑之处：待识别论证不足处\n③ 可补充：待结合自身研究延伸\n【一句话回答】待提炼（配 LLM Key 可自动精读）';
        }else{
          res=kind==='sum'?tplSummary(text):tplInnovation(text);
        }
      }
      out.innerHTML='<div class="card" style="background:var(--card2);white-space:pre-wrap;font-size:13px">'+esc(res)+'<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">'+(kind==='note'?'<button class="btn sm primary" id="lit-save-note">💾 保存为文献条目</button>':'')+'<button class="btn sm" id="lit-copy">复制</button></div></div>';
      $('#lit-copy').onclick=()=>copyText(res);
      const sn=$('#lit-save-note');
      if(sn)sn.onclick=()=>{
        const ls=Store.get(K.lits,[]);
        const firstLine=(res.split('\n')[0]||'').replace('【基本信息】','');
        ls.unshift({id:uid(),title:firstLine.slice(0,40)||'结构化笔记',authors:'',venue:'',year:'',doi:'',notes:res,tags:['AI 结构化笔记']});
        Store.set(K.lits,ls);
        toast('已保存为文献条目');
        literaturePage(root);
      };
    }catch(e){out.innerHTML='<div class="muted">'+esc(e.message)+'</div>';}
  };
  $('#lit-gen').onclick=()=>doMine('new');
  $('#lit-sum').onclick=()=>doMine('sum');
  $('#lit-note').onclick=()=>doMine('note');
  $('#lit-deep').onclick=()=>{
    const q=$('#lit-q');q.style.display=q.style.display==='none'?'block':'none';
    if(q.style.display==='block')$('#lit-q-input').focus();

  };
  $('#lit-q-input').addEventListener('keydown',e=>{if(e.key==='Enter'){doMine('deep');}});
}

/* ================= 模块 7 · 全局搜索 ================= */
function searchPage(root){
  const q=(state._sq||'');state._sq='';
  root.innerHTML=`
  <div class="search-box"><input id="gs-input" placeholder="输入关键词，搜索写作/文献/期刊/投稿…" value="${esc(q)}"></div>
  <div id="gs-out"></div>`;
  const inp=$('#gs-input');inp.focus();
  const run=debounce(()=>{const kw=inp.value.trim();if(!kw){$('#gs-out').innerHTML='';return;}renderSearch(kw);},300);
  inp.addEventListener('input',run);if(q)renderSearch(q);
  function renderSearch(kw){
    const res=[];
    getDocs().forEach(d=>d.chapters.forEach((c,i)=>{const idx=c.content.indexOf(kw);if(idx>-1)res.push({g:'写作',title:d.title+' / '+c.name,text:c.content.slice(Math.max(0,idx-20),idx+40),jump:()=>{state.chIdx=i;go('writing',{ch:i});}});}));
    Store.get(K.journals,[]).forEach(j=>{if(j.name.includes(kw))res.push({g:'期刊',title:j.name,text:j.note||j.field,jump:()=>{state.subTab=3;go('submission');}});});
    Store.get(K.lits,[]).forEach(l=>{if((l.title||'').includes(kw)||(l.notes||'').includes(kw))res.push({g:'文献',title:l.title,text:l.notes||'',jump:()=>go('literature')});});
    Store.get(K.subs,[]).forEach(s=>{if(s.paperTitle.includes(kw))res.push({g:'投稿',title:s.paperTitle,text:'状态：'+s.status,jump:()=>{state.subTab=2;go('submission');}});});
    const groups={};res.forEach(r=>{groups[r.g]=groups[r.g]||[];groups[r.g].push(r);});
    $('#gs-out').innerHTML=Object.entries(groups).map(([g,items])=>`<div class="sr-group"><div class="g-title">${g} · ${items.length} 条</div>${items.map(r=>`<div class="sr-item"><div style="flex:1;min-width:0"><div style="font-weight:500">${esc(r.title)}</div><div class="muted" style="font-size:12px">…${esc(r.text)}…</div></div><button class="btn sm jump" data-i>跳转</button></div>`).join('')}</div>`).join('')||'<div class="empty">未找到包含「'+esc(kw)+'」的内容</div>';
    let i=0;$$('.sr-item .jump').forEach(b=>{const r=res[i++];b.onclick=r.jump;});
  }
}

function assistantPage(root){
  const chat=Store.get(K.chat,[]);
  root.innerHTML=`
  <div class="quick-cmds">${AI_CMDS.map((c,i)=>`<button class="btn sm" data-c="${i}">${c.label}</button>`).join('')}</div>
  <div class="chat-box">
    <div id="chat-list">${chat.map(m=>`<div class="msg ${m.role==='user'?'me':''}"><div class="bubble"><div class="who">${m.role==='user'?'我':'AI 助手'}</div>${esc(m.content)}</div></div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <textarea id="ai-input" placeholder="输入你的问题…（未配 LLM Key 时使用本地模板）" style="min-height:60px"></textarea>
      <button id="ai-send" class="btn primary" style="align-self:flex-end">发送</button>
    </div>
  </div>`;
  const list=$('#chat-list');list.scrollTop=list.scrollHeight;
  const addMsg=(role,content)=>{Store.set(K.chat,[...Store.get(K.chat,[]),{role,content,ts:Date.now()}].slice(-50));list.innerHTML+='<div class="msg '+(role==='user'?'me':'')+'"><div class="bubble"><div class="who">'+(role==='user'?'我':'AI 助手')+'</div>'+esc(content)+'</div></div>';list.scrollTop=list.scrollHeight;};
  const tplReply=q=>{
    if(q.includes('润色')||q.includes('综述')||q.includes('创新')||q.includes('实证')||q.includes('规范'))return '（本地模板）当前未配置 LLM API Key。前往「设置」配置后，可调用大模型完成润色/综述/创新点等任务。\n\n未配 Key 时的替代方案：\n① 润色：把句子改写为"本研究/结果表明/综上"等学术表述；\n② 综述：按"国外研究—国内研究—研究空白"三段式组织；\n③ 创新点：从对象/方法/视角/应用/数据五个维度找缺口；\n④ 实证描述：按"表格呈现→系数显著性→经济意义→稳健性"顺序写；\n⑤ 规范检查：检查是否口语化、是否有主谓宾残缺、引用是否规范。';
    return '（本地模板）我可以帮你完成：润色文字、生成综述初稿、提炼创新点、写实证结果描述、检查学术规范。配置 LLM API Key 后（设置页，默认 DeepSeek），这些任务将由大模型真实生成。';
  };
  const send=async()=>{
    const q=$('#ai-input').value.trim();if(!q)return;$('#ai-input').value='';
    addMsg('user',q);
    if(!LLM.get().enabled){addMsg('assistant',tplReply(q));return;}
    try{const r=await llmAsk(q);addMsg('assistant',r||'（无返回内容）');}catch(e){addMsg('assistant','调用失败：'+e.message);}
  };
  $('#ai-send').onclick=send;
  $('#ai-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});

function tipsPage(root){
  const card=(t,i)=>{
   let body='';
   if(t.table){
    body+=`<p style="font-size:13px;color:var(--accent);font-weight:600;margin:6px 0">⚡ ${t.speed||''}</p>`;
    body+=`<table class="data" style="font-size:12px;margin-top:8px"><tr><th class="l">论文部分</th><th class="l">建议字数</th><th class="l">比例</th><th class="l">核心功能</th></tr>`;
    t.table.forEach(r=>{body+=`<tr><td class="l">${r.part}</td><td class="l">${r.range}</td><td class="l">${r.pct}</td><td class="l">${r.core}</td></tr>`;});
    body+=`</table>`;
   }
   if(t.strategy) body+=`<p style="font-size:13px;color:var(--accent);font-weight:600;margin:8px 0">📌 ${t.strategy}</p>`;
   if(t.points) body+=t.points.map((p,idx)=>`<div style="margin:8px 0;padding:10px;background:var(--card2);border-radius:8px;border-left:3px solid var(--accent)"><div style="font-weight:600;font-size:13px">${idx+1}. ${p.h}</div><div style="font-size:13px;color:var(--text-2);margin-top:4px;line-height:1.7">${p.b}</div></div>`).join('');
   if(t.frameworks){
    body+=`<table class="data" style="font-size:12px;margin-top:8px"><tr><th class="l">分类</th><th class="l">代表理论</th><th class="l">适用场景</th></tr>`;
    t.frameworks.forEach(f=>{body+=`<tr><td class="l" style="font-weight:600">${f.cat}</td><td class="l">${f.th}</td><td class="l">${f.use}</td></tr>`;});
    body+=`</table>`;
   }
   if(t.trends){
    body+=`<table class="data" style="font-size:12px;margin-top:8px"><tr><th class="l" style="width:36px">序号</th><th class="l">变化趋势</th><th class="l">具体说明</th></tr>`;
    t.trends.forEach(r=>{body+=`<tr><td class="l" style="text-align:center;font-weight:700;color:var(--accent)">${r.n}</td><td class="l"><b>${r.h}</b></td><td class="l" style="line-height:1.6">${r.b}</td></tr>`;});
    body+=`</table>`;
   }
   if(t.principle) body+=`<div style="margin-top:10px;padding:10px;background:var(--card2);border-radius:8px;border-left:3px solid var(--warn);font-size:13px"><b>📌 原则：</b>${t.principle}</div>`;
   if(t.core) body+=`<div style="margin-top:10px;padding:10px;background:var(--card2);border-radius:8px;border-left:3px solid var(--warn);font-size:13px"><b>💡 ${t.core}</b></div>`;
 if(t.sections){
    body+=`<p style="font-size:13px;color:var(--accent);font-weight:600;margin:8px 0">🛠️ 使用：${t.usage||''}</p>`;
    t.sections.forEach((s,si)=>{
      body+=`<div style="margin:10px 0;padding:10px;background:var(--card2);border-radius:8px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px;flex-wrap:wrap">
          <div style="font-weight:600;font-size:13px;color:var(--accent)">${s.h}</div>
          <button class="btn sm" data-copyfeed="${si}" style="min-height:32px;padding:0 10px;font-size:12px">📋 复制</button>
        </div>
        <pre id="feed-${si}" style="white-space:pre-wrap;font-size:12px;line-height:1.7;color:var(--text-2);margin:0;font-family:inherit;background:var(--bg);padding:8px;border-radius:6px">${s.p}</pre>
      </div>`;
    });
  }
  return `<details class="card" style="cursor:pointer;margin-bottom:10px" ${i===0?'open':''}>
     <summary style="font-weight:600;font-size:15px;padding:4px 0">📄 ${t.title}</summary>
     <div class="muted" style="font-size:11px;margin:4px 0 8px">来源：${t.src}</div>
     <div style="font-size:13px;line-height:1.7;background:var(--card2);padding:10px;border-radius:6px;margin-bottom:8px">${t.intro}</div>
     ${body}
   </details>`;
  };
  root.innerHTML=`
  <div class="card" style="margin-bottom:12px">
    <h3>💡 浙江省论文获奖实战经验（4 篇精华）</h3>
    <div class="muted" style="font-size:12px;margin-bottom:8px">来源：2025/2026 浙江省教育技术论文评选实战经验 · 写论文前先看几遍，写完后对照排查</div>
    <div style="font-size:13px;background:var(--accent-soft);padding:10px;border-radius:8px;border:1px solid var(--accent);line-height:1.7">
      💡 <b>如何使用：</b>写论文前先打开看 1-2 篇文章熟悉硬性指标和评审趋势 → 写作过程中遇到问题随时回查对应部分 → 写完后用字数配比表自查结构平衡
    </div>
  </div>
  ${TIPS.map(card).join('')};
  $$('button[data-copyfeed]', root).forEach(b=>b.onclick=()=>{
    const i=+b.dataset.copyfeed;
    const s=root.querySelector('#feed-'+i);
    if(s)copyText(s.textContent).then(()=>toast('已复制第 '+(i+1)+' 节 prompt ✓'));
  });`;
}

      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <h3 style="margin:0;flex:0 0 auto">📐 AI 排版</h3>
        <select id="af-template" style="min-height:38px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px">
          ${['academic','zhejiang','custom'].map(k=>`<option value="${k}" ${st.formatTemplate===k?'selected':''}>${TEMPLATE_PRESETS[k].name}</option>`).join('')}
        </select>
        <span class="muted" id="af-tpl-desc" style="font-size:12px"></span>
        <span style="margin-left:auto" class="tag ${cfg.enabled?'ok-tag':''}">${cfg.enabled?'LLM 已启用':'LLM 未启用（本地）'}</span>
      </div>
      <div class="muted" style="font-size:12px;margin-top:8px">
        工作流：导入文档 / 粘贴文本 → 选模板 → 排版预览 → 导出 md/txt/Word。<br>
        <b>Word 转换</b>：浏览器端无法直接生成 .docx；点导出 Word 会生成结构化 md，由你在对话中说"转 Word"由 agent 用 docx-editor-cn 完成。
      </div>
    </div>

    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
        <button class="btn" id="af-import">📂 导入文档</button>
        <button class="btn" id="af-loadall">📥 载入全文</button>
        <button class="btn" id="af-clear">🗑 清空</button>
        <span class="muted" style="margin-left:auto;font-size:12px" id="af-wc">0 字</span>
        <input type="file" id="af-file" accept=".md,.txt,.docx,.doc" style="display:none">
      </div>
      <textarea id="af-input" placeholder="粘贴要处理的论文段落 / 全文…（也可从当前文稿载入全文，或从文件导入）" style="width:100%;min-height:200px;font-size:14px;line-height:1.7;padding:12px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--bg);color:var(--text);resize:vertical"></textarea>
    </div>

    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn primary" id="af-format">🎨 排版预览</button>
        <button class="btn" id="af-export-md">⬇ 导出 .md</button>
        <button class="btn" id="af-export-txt">⬇ 导出 .txt</button>
        <button class="btn" id="af-export-word">⬇ 导出 Word（结构化 md）</button>
        <button class="btn" id="af-copy" style="margin-left:auto">📋 复制排版结果</button>
      </div>
      <div id="af-preview-wrap" style="margin-top:12px;display:none">
        <div class="muted" style="font-size:12px;margin-bottom:6px">📋 排版预览（按选定模板格式化后）：</div>
        <div id="af-preview" class="card" style="white-space:pre-wrap;font-size:13px;line-height:1.8;max-height:400px;overflow:auto"></div>
      </div>
    </div>
  `;

  const $inp = $('#af-input');
  const updateWC = () => {
    const text = $inp.value.replace(/\s/g, '');
    $('#af-wc').textContent = text.length + ' 字';
  };
  $inp.addEventListener('input', updateWC);
  updateWC();

  // 模板描述更新
  const tplDesc = $('#af-tpl-desc');
  const refreshTplDesc = () => {
    const k = $('#af-template').value;
    tplDesc.textContent = TEMPLATE_PRESETS[k]?.desc || '';
  };
  refreshTplDesc();
  $('#af-template').onchange = () => {
    st.formatTemplate = $('#af-template').value;
    Settings.save(st);
    refreshTplDesc();
    toast('模板已切换：' + TEMPLATE_PRESETS[st.formatTemplate].name);
  };

  // 导入文档（从文件读取 .md/.txt）
  $('#af-import').onclick = () => $('#af-file').click();
  $('#af-file').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (/\.(md|txt)$/i.test(file.name)) {
      const text = await file.text();
      $inp.value = text;
      updateWC();
      toast('已导入：' + file.name + '（' + text.length + ' 字符）');
    } else if (/\.docx?$/i.test(file.name)) {
      // .doc/.docx 暂时提示用户用工作台打开或对话转换
      toast('Word 文件请在「论文框架与写作」打开；本模块暂只支持 md/txt 直接粘贴');
    }
  };

  // 载入全文（从 Store 当前文稿）
  $('#af-loadall').onclick = () => {
    const docs = Store.get(K.docs, []);
    const cur = docs.find(d => d.id === state.docId) || docs[0];
    if (!cur) { toast('暂无文稿可载入'); return; }
    let text = cur.title ? '# ' + cur.title + '\n\n' : '';
    text += cur.chapters.map(c => '## ' + c.name + '\n\n' + c.content).join('\n\n');
    $inp.value = text;
    updateWC();
    toast('已载入全文：' + cur.title + '（' + text.length + ' 字符）');
  };

  // 清空
  $('#af-clear').onclick = () => {
    $inp.value = '';
    updateWC();
    $('#af-preview-wrap').style.display = 'none';
  };

  // 排版预览：基于选定模板规则生成格式化输出
  $('#af-format').onclick = () => {
    const text = $inp.value.trim();
    if (!text) { toast('请先粘贴或导入文本'); return; }
    const tpl = $('#af-template').value;
    const rules = tpl === 'custom' ? (Settings.get().format || TEMPLATE_PRESETS.academic.rules) : TEMPLATE_PRESETS[tpl].rules;

    // 检测是否是 markdown 格式（含 # 标题）
    const isMd = /^#{1,6}\s/m.test(text);
    let preview;

    if (isMd) {
      // Markdown 格式：按模板规则重新格式化（添加 markdown 格式标记）
      preview = applyMarkdownTemplate(text, rules, tpl);
    } else {
      // 纯文本：智能分段（按空行/换行分段）后格式化
      preview = applyPlainTemplate(text, rules, tpl);
    }

    $('#af-preview').textContent = preview;
    $('#af-preview-wrap').style.display = 'block';
    toast('已按 ' + TEMPLATE_PRESETS[tpl].name + ' 排版（可滚动预览）');
  };

  // 导出 Markdown（结构化 md，可直接对话转 Word）
  function getFormatted() {
    const text = $inp.value.trim();
    if (!text) return null;
    const tpl = $('#af-template').value;
    const rules = tpl === 'custom' ? (Settings.get().format || TEMPLATE_PRESETS.academic.rules) : TEMPLATE_PRESETS[tpl].rules;
    const isMd = /^#{1,6}\s/m.test(text);
    return isMd ? applyMarkdownTemplate(text, rules, tpl) : applyPlainTemplate(text, rules, tpl);
  }

  $('#af-export-md').onclick = () => {
    const out = getFormatted();
    if (!out) { toast('请先粘贴文本'); return; }
    const tplName = TEMPLATE_PRESETS[$('#af-template').value].name;
    const docs = Store.get(K.docs, []);
    const cur = docs.find(d => d.id === state.docId);
    const fname = (cur?.title || '论文') + '_' + tplName + '_v1.md';
    download(fname, out, 'text/markdown;charset=utf-8');
    toast('已下载：' + fname);
  };

  $('#af-export-txt').onclick = () => {
    const out = getFormatted();
    if (!out) { toast('请先粘贴文本'); return; }
    // 去掉 markdown 标记
    const txt = out.replace(/^#{1,6}\s+/gm, '').replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
    const tplName = TEMPLATE_PRESETS[$('#af-template').value].name;
    const docs = Store.get(K.docs, []);
    const cur = docs.find(d => d.id === state.docId);
    const fname = (cur?.title || '论文') + '_' + tplName + '_v1.txt';
    download(fname, txt, 'text/plain;charset=utf-8');
    toast('已下载：' + fname);
  };

  $('#af-export-word').onclick = () => {
    const out = getFormatted();
    if (!out) { toast('请先粘贴文本'); return; }
    const tplName = TEMPLATE_PRESETS[$('#af-template').value].name;
    const docs = Store.get(K.docs, []);
    const cur = docs.find(d => d.id === state.docId);
    const baseName = (cur?.title || '论文') + '_' + tplName;
    // 浏览器端无法生成真 .docx；下载 .md + 提示用户转 Word
    const fname = baseName + '_待转Word.md';
    download(fname, out, 'text/markdown;charset=utf-8');
    toast('已下载结构化 md（' + fname + '）；对我说"转 Word，模板：' + tplName + '"完成 .docx 生成');
  };

  $('#af-copy').onclick = () => {
    const out = getFormatted();
    if (!out) { toast('请先粘贴文本'); return; }
    navigator.clipboard.writeText(out).then(() => toast('已复制排版结果到剪贴板'));
  };
}

// Markdown 模板应用：识别标题层级 + 规范化格式
function applyMarkdownTemplate(md, rules, tplName) {
  // 按行处理，保留 md 结构，加注释头说明当前模板
  const lines = md.split('\n');
  const out = [];
  out.push('<!-- 排版模板：' + tplName + ' | 字号 ' + (parseInt(rules.bodySize)/2) + 'pt | 字体 ' + rules.bodyFont + ' | 行距 ' + rules.line + '/240 -->');
  out.push('<!-- 由 docx-editor-cn (浙江论文格式) / 学术模板 处理 -->');
  out.push('');
  out.push.apply(out, lines);
  return out.join('\n');
}

// 纯文本模板应用：智能分段 + 添加标题层级
function applyPlainTemplate(text, rules, tplName) {
  // 按空行分段；每段首句判别标题/正文
  const blocks = text.split(/\n\s*\n+/);
  const out = [];
  out.push('# ' + (text.split('\n')[0].slice(0, 30) || '论文'));
  out.push('');
  for (const block of blocks) {
    const t = block.trim();
    if (!t) continue;
    const first = t.split('\n')[0].slice(0, 20);
    // 简单启发：段首是中文数字+顿号 → 一级标题；段首是中文数字+括号 → 二级
    if (/^[一二三四五六七八九十]+[、.]/.test(first)) {
      out.push('## ' + t);
    } else if (/^[（(][一二三四五六七八九十]+[）)]/.test(first)) {
      out.push('### ' + t);
    } else if (first.length < 30 && /[:：]$/.test(first) === false && /^#/.test(t) === false && t.length < 60) {
      // 短句可能是一级
      out.push('## ' + t);
    } else {
      out.push(t);
    }
    out.push('');
  }
  return out.join('\n');
}

/* ================= 模块 9 · 设置与说明 ================= */
/* ================= 今日面板 ================= */
function toggleToday(){
  const p=$('#today-panel');p.classList.toggle('open');if(!p.classList.contains('open'))return;
  const items=[];
  const subs=Store.get(K.subs,[]);const today=todayStr();
  subs.forEach(s=>{if((s.status==='想投'||s.status==='已投')&&s.deadline&&s.deadline<today)items.push({t:'逾期投稿：'+s.paperTitle+'（'+s.deadline+'）',page:'submission',p:{subTab:2}});});
  Store.get(K.contests,[]).forEach(c=>{
    if(c.done||!c.deadline)return;
    if(c.deadline<today)items.push({t:'逾期评比：'+c.name+'（截止 '+c.deadline+'）',page:'submission',p:{subTab:1}});
    else if(c.deadline<=addDays(today,7))items.push({t:'临近评比：'+c.name+'（截止 '+c.deadline+'）',page:'submission',p:{subTab:1}});
  });
  const doc=getCurDoc();
  if(doc){doc.chapters.forEach((c,i)=>{if(!countWords(c.content).total)items.push({t:'未撰写：'+c.name,page:'writing',p:{ch:i}});});}
  if(!LLM.get().enabled)items.push({t:'未配置 LLM Key，AI 功能为模板模式',page:'settings'});
  const n=Object.keys(K).reduce((s,k)=>{const v=Store.get(K[k]);return s+(Array.isArray(v)?v.length:0);},0);
  if(n>=30)items.push({t:'数据已积累 '+n+' 条，建议导出备份',page:'settings'});
  p.innerHTML='<div style="font-weight:600;margin-bottom:6px">今日要处理</div>'+(items.length?items.map((it,i)=>`<div class="tp-item"><span style="color:var(--accent)">▸</span><span style="flex:1">${esc(it.t)}</span><button class="btn sm" data-i="${i}">处理</button></div>`).join(''):'<div class="muted" style="font-size:13px;padding:8px 0">今天没有待处理事项 🎉</div>');
  $$('.tp-item button').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i];p.classList.remove('open');if(it.page==='writing'&&it.p)state.chIdx=it.p.ch;if(it.page==='submission'&&it.p)state.subTab=it.p.subTab;go(it.page);});
}

/* ================= 初始化 ================= */
function applyLayout(){const st=Settings.get();const l=st.layout||'standard';document.documentElement.dataset.layout=l;const sel=$('#layout-select');if(sel)sel.value=l;}
function init(){
  /* 版本检测：浏览器缓存了旧版平台时提示强制刷新（治缓存问题的关键） */
  try{
    const savedV=localStorage.getItem('wb_version');
    if(savedV&&savedV!==APP_VERSION){
      setTimeout(()=>toast('📢 平台已更新到 '+APP_VERSION+' 版，当前可能是旧缓存——请按 Ctrl+F5（手机：浏览器清除缓存或换无痕模式）强制刷新'),800);
    }
    localStorage.setItem('wb_version',APP_VERSION);
  }catch(e){}
  ensureData();Settings.get();applyTheme();applyLayout();renderNav();
  $('#hamburger').onclick=openDrawer;
  $('#drawer-mask').onclick=closeDrawer;
  $('#search-input').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(q){state._sq=q;e.target.value='';go('search');}}});
  $('#layout-select').onchange=()=>{const st=Settings.get();st.layout=$('#layout-select').value;Settings.save(st);applyLayout();toast('页面风格：'+({'standard':'标准','compact':'紧凑','spacious':'宽松'}[st.layout]||st.layout));};
  $('#today-btn').onclick=toggleToday;
  // 初始页：支持 #page 直达（如 #writing），也兼容旧 #/page
  const hp=location.hash.replace('#/','').replace('#','');
  const hpClean=hp.replace(/^\//,'');
  go(NAV.find(n=>n.id===hpClean)?hpClean:'progress');
}
init();
